        let rawDeck = loadStoredDeck();
        let currentDeck = [...rawDeck];
        let sel = 0;
        let currentFilter = 'ALL';
        const userAnswers = loadStoredAnswers();
        const revealed = {};
        const tb = document.getElementById('tb');

        function loadStoredDeck() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_DECK);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch(e) {}
            return [...defaultDeck];
        }
        function loadStoredAnswers() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_ANSWERS);
                if (saved) return JSON.parse(saved);
            } catch(e) {}
            return {};
        }
        function saveDeckToStorage() { try { localStorage.setItem(STORAGE_KEY_DECK, JSON.stringify(rawDeck)); } catch(e) {} }
        function saveAnswersToStorage() { try { localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers)); } catch(e) {} }
        function getCardKey(card) { return card.id || `card-${card.article}`; }
        function norm(a) { return (a || "O").trim().toUpperCase(); }

        function resetToDefaultDeck() {
            if (confirm("기본 데이터로 초기화하고 입력 기록을 지우시겠습니까?")) {
                localStorage.removeItem(STORAGE_KEY_DECK);
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                rawDeck = [...defaultDeck];
                for (let k in userAnswers) delete userAnswers[k];
                for (let k in revealed) delete revealed[k];
                saveDeckToStorage(); saveAnswersToStorage();
                setFilter('ALL');
            }
        }

        function shuffleDeck() {
            if (currentDeck.length <= 1) return;
            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }
            sel = 0;
            render();
        }

        function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

        function render() {
            updateCounts();
            let html = "";
            currentDeck.forEach((card, i) => {
                const key = getCardKey(card);
                const ua = userAnswers[key];
                const show = !!ua || !!revealed[key];
                const ans = norm(card.answer);
                const cls = ua ? (ua.isCorrect ? "ok" : "ng") : "";
                html += `<tr data-i="${i}" class="${i === sel ? 'sel' : ''}">` +
                    `<td class="rn">${i + 2}</td>` +
                    `<td class="c">${esc(card.id || i + 1)}</td>` +
                    `<td class="t${i === sel ? ' act' : ''}">${esc(card.article)}</td>` +
                    `<td class="c ${cls}">${ua ? esc(ua.userAns) : ""}</td>` +
                    `<td class="c ${cls}">${show ? ans : ""}</td>` +
                    `<td class="t">${show ? esc(card.reason) : ""}</td></tr>`;
            });
            if (!currentDeck.length) html = `<tr><td class="rn">2</td><td></td><td class="t">해당하는 데이터가 없습니다.</td><td></td><td></td><td></td></tr>`;
            tb.innerHTML = html;
            updateBars();
        }

        function updateBars() {
            const n = currentDeck.length;
            document.getElementById('namebox').textContent = n ? "B" + (sel + 2) : "B2";
            document.getElementById('fval').textContent = n ? currentDeck[sel].article : "";
            document.getElementById('stat').textContent = n ? `${sel + 1} / ${n}` : "개수: 0";
        }

        function select(i, scroll) {
            if (!currentDeck.length) return;
            sel = Math.max(0, Math.min(currentDeck.length - 1, i));
            const rows = tb.children;
            for (let r = 0; r < rows.length; r++) {
                rows[r].classList.toggle('sel', r === sel);
                const t = rows[r].children[2];
                if (t) t.classList.toggle('act', r === sel);
            }
            updateBars();
            if (scroll) rows[sel].scrollIntoView({ block: 'nearest' });
        }
        function move(d) { select(sel + d, true); }

        tb.addEventListener('click', e => {
            const tr = e.target.closest('tr');
            if (tr && tr.dataset.i !== undefined) select(parseInt(tr.dataset.i, 10), false);
        });

        function answer(userAns) {
            if (!currentDeck.length) return;
            const card = currentDeck[sel];
            const key = getCardKey(card);
            userAnswers[key] = { isCorrect: userAns === norm(card.answer), userAns };
            saveAnswersToStorage();
            keepRender();
        }
        function clearAnswer() {
            if (!currentDeck.length) return;
            const key = getCardKey(currentDeck[sel]);
            delete userAnswers[key]; delete revealed[key];
            saveAnswersToStorage();
            keepRender();
        }
        function toggleReveal() {
            if (!currentDeck.length) return;
            const key = getCardKey(currentDeck[sel]);
            revealed[key] = !revealed[key];
            keepRender();
        }
        function keepRender() {
            const top = document.getElementById('sheet').scrollTop;
            render();
            document.getElementById('sheet').scrollTop = top;
            tb.children[sel] && tb.children[sel].scrollIntoView({ block: 'nearest' });
        }

        document.addEventListener('keydown', e => {
            if (e.ctrlKey || e.metaKey || e.altKey) return;
            const k = e.key;
            if (k === 'ArrowDown') { e.preventDefault(); move(1); }
            else if (k === 'ArrowUp') { e.preventDefault(); move(-1); }
            else if (k === 'o' || k === 'O' || k === 'ㅐ') answer('O');
            else if (k === 'x' || k === 'X' || k === 'ㅌ') answer('X');
            else if (k === 'Enter' || k === ' ') { e.preventDefault(); toggleReveal(); }
            else if (k === 'Delete' || k === 'Backspace') clearAnswer();
        });

        function setFilter(type) {
            currentFilter = type;
            document.getElementById('fAll').className = type === 'ALL' ? 'on' : '';
            document.getElementById('fInc').className = type === 'INCORRECT' ? 'on' : '';
            document.getElementById('fUn').className = type === 'UNANSWERED' ? 'on' : '';
            applyFilter();
        }
        function applyFilter() {
            if (currentFilter === 'ALL') currentDeck = [...rawDeck];
            else if (currentFilter === 'INCORRECT') currentDeck = rawDeck.filter(c => { const a = userAnswers[getCardKey(c)]; return a && !a.isCorrect; });
            else currentDeck = rawDeck.filter(c => !userAnswers[getCardKey(c)]);
            sel = 0;
            render();
            document.getElementById('sheet').scrollTop = 0;
        }
        function updateCounts() {
            let inc = 0, un = 0;
            rawDeck.forEach(c => { const a = userAnswers[getCardKey(c)]; if (!a) un++; else if (!a.isCorrect) inc++; });
            document.getElementById('cAll').textContent = rawDeck.length;
            document.getElementById('cInc').textContent = inc;
            document.getElementById('cUn').textContent = un;
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                let text = "";
                try { text = new TextDecoder('utf-8', { fatal: true }).decode(buffer); }
                catch (err) {
                    try { text = new TextDecoder('euc-kr').decode(buffer); }
                    catch (e2) { text = new TextDecoder('iso-8859-1').decode(buffer); }
                }
                parseCSVData(text);
            };
            reader.readAsArrayBuffer(file);
            event.target.value = "";
        }

        function parseCSVData(text) {
            const lines = text.replace(/^\uFEFF/, '').split(/\r\n|\n/);
            const parsed = [];
            let isHeader = true;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                const tokens = parseCSVLine(line);
                if (tokens.length < 2) continue;
                if (isHeader && (tokens[0].includes("지문") || tokens[0].includes("question") || tokens[0].toLowerCase().includes("article"))) { isHeader = false; continue; }
                isHeader = false;
                const article = tokens[0] ? tokens[0].trim() : "";
                const answer = tokens[1] ? tokens[1].trim().toUpperCase() : "O";
                const reason = tokens[2] ? tokens[2].trim() : "";
                if (article) parsed.push({ id: parsed.length + 1, article, answer, reason });
            }
            if (parsed.length > 0) {
                rawDeck = parsed;
                for (let k in userAnswers) delete userAnswers[k];
                for (let k in revealed) delete revealed[k];
                saveDeckToStorage(); saveAnswersToStorage();
                setFilter('ALL');
                alert(`${parsed.length}개 행을 불러왔습니다.`);
            } else {
                alert("유효한 데이터를 찾지 못했습니다. 양식을 확인해 주세요.");
            }
        }

        function parseCSVLine(text) {
            const delimiter = text.includes('\t') ? '\t' : ',';
            const result = [];
            let cur = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === delimiter && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result.map(str => str.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function downloadCSVTemplate() {
            const csvContent = "\uFEFF지문,정답,해설\n" +
                "\"독립한 부동산은 종물이 될 수 없다.\",X,\"독립된 건물이라도 주물의 효용을 돕는다면 종물이 될 수 있습니다.\"\n" +
                "\"부첩관계의 종료를 해제조건으로 하는 증여계약은 무효이다.\",O,\"불륜관계 유지를 강요하는 불법조건이므로 무효입니다.\"\n" +
                "\"이중매매임을 알고 매수한 것만으로 무효가 되지는 않는다.\",O,\"단순 악의만으로는 유효하며, 적극 가담해야 무효가 됩니다.\"";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "template.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        
        render();
    </script>
</body>
</html>
