<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민법 OX 플래시카드 - 스마트 학습기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans text-slate-800">

    <header class="w-full max-w-2xl mx-auto mb-4 flex flex-col sm:flex-row justify-between items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">민법 OX 플래시카드</h1>
                <p class="text-xs text-slate-500">판례 및 조문 암기 도우미</p>
            </div>
        </div>

        <!-- Controls: Shuffle, Reset, CSV Upload, Template Download -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <button onclick="shuffleDeck()" title="현재 카드를 무작위로 섞습니다" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all border border-indigo-200 active:scale-95">
                <i class="fa-solid fa-shuffle"></i>
                <span>카드 섞기</span>
            </button>
            <button onclick="resetToDefaultDeck()" title="기본 문제 덱으로 초기화" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-all border border-rose-200 active:scale-95">
                <i class="fa-solid fa-rotate-left"></i>
                <span>초기화</span>
            </button>
            <button onclick="downloadCSVTemplate()" title="CSV 템플릿 다운로드" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all border border-slate-200">
                <i class="fa-solid fa-file-csv text-indigo-600"></i>
                <span>템플릿</span>
            </button>
            <label for="csvFileInput" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-xl cursor-pointer shadow-sm transition-all">
                <i class="fa-solid fa-file-import"></i>
                <span>CSV 업로드</span>
            </label>
            <input type="file" id="csvFileInput" accept=".csv, .tsv, .txt" class="hidden" onchange="handleCSVUpload(event)">
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col justify-center">
        
        <!-- Filter & Progress Container -->
        <div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-filter text-xs text-indigo-500"></i>
                    <span class="text-xs font-bold text-slate-600">필터:</span>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto text-xs font-medium">
                    <button id="filterAll" onclick="setFilter('ALL')" class="px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 transition-all">전체 (<span id="countAll">0</span>)</button>
                    <button id="filterIncorrect" onclick="setFilter('INCORRECT')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">틀린 지문 (<span id="countIncorrect">0</span>)</button>
                    <button id="filterUnanswered" onclick="setFilter('UNANSWERED')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">미풀이 (<span id="countUnanswered">0</span>)</button>
                </div>
            </div>

            <!-- Progress Info -->
            <div class="flex justify-between items-center">
                <span id="progressText" class="text-sm font-semibold text-slate-700">0 / 0</span>
                <span id="resultBadge" class="hidden text-xs font-bold px-3 py-1 rounded-full shadow-sm"></span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200">
                <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300 rounded-full"></div>
            </div>
        </div>

        <div class="perspective-1000 w-full h-80 cursor-pointer my-2" id="cardContainer">
            <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-lg border border-slate-200/80 bg-white">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-white rounded-3xl">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold tracking-wider text-indigo-600 uppercase bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-full">지문</span>
                        <span id="cardBadge" class="text-xs text-slate-400 font-medium"></span>
                    </div>
                    
                    <p id="articleText" class="text-base sm:text-lg font-semibold text-slate-800 break-keep leading-relaxed my-auto max-h-48 overflow-y-auto no-scrollbar w-full px-2">
                        질문을 불러오는 중입니다...
                    </p>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                        <i class="fa-solid fa-rotate text-indigo-400"></i>
                        <span>카드를 클릭하면 정답과 해설이 뒤집힙니다</span>
                    </div>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-slate-900 text-white rounded-3xl shadow-inner">
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-xs font-bold tracking-wider text-slate-400 uppercase bg-slate-800 px-3 py-1 rounded-full border border-slate-700">정답 해설</span>
                        <div id="correctAnswerDisplay" class="text-3xl font-black mt-1"></div>
                    </div>
                    
                    <div class="overflow-y-auto max-h-36 my-auto w-full px-2 no-scrollbar">
                        <p id="reasonText" class="text-sm sm:text-base text-slate-200 leading-relaxed break-keep font-medium"></p>
                    </div>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                        <i class="fa-solid fa-rotate text-slate-400"></i>
                        <span>카드를 클릭하면 지문으로 돌아갑니다</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- OX Answer Buttons -->
        <div class="grid grid-cols-2 gap-4 mt-4">
            <button id="btnAnswerO" onclick="submitAnswer('O')" class="py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-regular fa-circle text-2xl"></i>
                <span>맞음 (O)</span>
            </button>
            <button id="btnAnswerX" onclick="submitAnswer('X')" class="py-4 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-xmark text-2xl"></i>
                <span>틀림 (X)</span>
            </button>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center mt-4 gap-4">
            <button id="btnPrev" onclick="prevCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-chevron-left"></i>
                <span>이전 카드</span>
            </button>
            <button id="btnResetCurrent" onclick="resetCurrentCardState()" class="px-3 py-3 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-600 font-semibold rounded-xl text-xs shadow-sm transition-all" title="이 카드의 학습 기록 초기화">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button id="btnNext" onclick="nextCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <span>다음 카드</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <footer class="w-full max-w-2xl mx-auto mt-6 text-center text-xs text-slate-400">
        민법 OX 플래시카드 &copy; Smart Study App
    </footer>

    <script>
        const STORAGE_KEY_DECK = "civil_law_quiz_deck_v4";
        const STORAGE_KEY_ANSWERS = "civil_law_quiz_answers_v4";

        // 101개 문항 기본 내장 데이터
        const defaultDeck = [
            { id: 1, article: "헌법의 기본권은 특별한 사정이 없으면 사법관계에 직접 적용된다", answer: "X", reason: "간접적으로 적용된다" },
            { id: 2, article: "관습법에 앞서 적용되는 법률이란 국회에서 제정된 법률만을 말한다", answer: "X", reason: "민법 제1조의 '법률'은 국회 제정 법률뿐만 아니라 명령·규칙·조례·조약 등 모든 성문법령을 의미" },
            { id: 3, article: "대법원이 정한 공탁규칙은 민법의 법원이 될 수 없다", answer: "X", reason: "공탁규칙은 성문법령으로 민법의 법원임" },
            { id: 4, article: "관습법에 의한 분묘기지권은 더 이상 인정되지 않는다", answer: "X", reason: "인정된다" },
            { id: 5, article: "무권대리인이 무권대리행위 후 단독으로 본인의 지위를 상속한 경우, 본인의 지위에서 그 무권대리행위의 추인을 거절하는 것은 신의칙에 반한다", answer: "O", reason: "무권대리인이 본인을 단독상속한 후 자신이 한 무권대리행위의 추인을 거절하는 것은 금반언의 원칙 및 신의칙에 반하여 허용되지 않는다." },
            { id: 6, article: "권리남용금지의 원칙은 본래적 의미의 권리뿐만 아니라 법인격의 남용에도 적용된다", answer: "O", reason: "권리남용금지의 원칙(민법 제2조 제2항)은 일반적인 권리행사뿐만 아니라 법인격을 악용하는 법인격 남용의 경우에도 적용된다." },
            { id: 7, article: "강행법규를 위반한 자가 스스로 강행법규 위반을 이유로 약정의 무효를 주장하는 것은 특별한 사정이 없는 한 신의칙에 반한다.", answer: "X", reason: "신의칙에 반하지 않는다" },
            { id: 8, article: "현행 민법은 태아의 권리능력에 관하여 일반적 보호주의를 취한다", answer: "X", reason: "개별적 보호주의를 취한다" },
            { id: 9, article: "태아는 불법행위로 인한 손해배상청구권에 관하여 이미 출생한 것으로 추정한다", answer: "X", reason: "추정한다> 본다" },
            { id: 10, article: "행위능력제도는 자기책임의 원칙을 구현하여 거래의 안전을 도모하기 위한 것이다", answer: "X", reason: "미성년자의 개인의 이익을 보호하는 민법의 근본결단" },
            { id: 11, article: "유언행위는 16세인 미성년자가 단독으로 유효하게 할 수 없는 법률행위이다", answer: "O", reason: "만17세에 달하지 못한자는 유언을 하지 못한다" },
            { id: 12, article: "가정법원은 피성년후견인이 성년후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다", answer: "X", reason: "취소할수 없는 법률행위의 범위를 정할 수 있다" },
            { id: 13, article: "가정법원은 피한정후견인이 한정후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다", answer: "O", reason: "가정법원은 피한정후견인이 한정후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다(민법 제12조 제1항)." },
            { id: 14, article: "특정후견의 심판이 있은 후에 피특정후견인이 특정후견인의 동의없이 재산상의 법률 행위를 하더라도 이는 취소의 대상이 되지 않는다", answer: "O", reason: "특정후견은 행위능력을 제한하지 않으므로, 피특정후견인이 동의 없이 한 행위라도 행위능력 부족을 이유로 취소할 수 없다." },
            { id: 15, article: "피성년후견인 甲이 법정대리인 乙의 동의서를 위조하는 방법으로 乙의 동의가 있는 것 처럼 믿게 하여 자기 소유 건물을 丙에게 매각하는 계약을 체결하였다. 丙은 甲을 상대로 계약의 추인여부에 대한 확답을 촉구할 수 있다", answer: "X", reason: "상대방 丙이 촉구할 수 있는 대상: 피성년후견인 甲 (X) / 법정대리인 乙 (O)" },
            { id: 16, article: "제한능력자와 계약을 맺은 선의의 상대방은 추인이 있기 전까지 의사표시를 거절할 수 있다", answer: "X", reason: "거절은 계약상대자가 하는 것으로 상대방은 철회하여야 한다" },
            { id: 17, article: "피성년후견인 甲이 법정대리인 乙의 동의서를 위조하는 방법으로 乙의 동의가 있는 것 처럼 믿게 하여 자기 소유 건물을 丙에게 매각하는 계약을 체결하였다. 乙은 丙 상대로 계약을 취소할 수 있다", answer: "O", reason: "제한능력자의 속임수로 인한 취소권 배제(제17조)는 '능력자'로 믿게 한 경우에 적용되며, 동의서를 위조한 피성년후견인은 동의만으로 행위할 수 없으므로 취소권이 배제되지 않는다." },
            { id: 18, article: "법원이 선임한 재산관리인은 법원의 허가 없이 부재자의 재산에 대한 차임을 청구할 수 있다", answer: "O", reason: "차임 청구는 재산의 보존 및 이용·개량행위에 해당하므로 법원의 허가 없이도 재산관리인이 할 수 있다." },
            { id: 19, article: "부재자가 스스로 위임한 재산관리인에게 재산처분권까지 준 경우에도 그 재산관리인은 재산처분에 법원의 허가를 얻어야 한다", answer: "X", reason: "별도로 허가를 얻을 필요가 없다" },
            { id: 20, article: "후순위 상속인도 실종선고를 청구할 수 있는 이해관계인에 포함된다", answer: "X", reason: "후순위 상속인은 이해관계인인 아니다(실종선고를 청구할 수 있는 이해관계인에는 실종선고로 인해 직접적인 법률상 권리·의무의 변동을 받는 1순위 공동상속인, 선순위자의 상속포기로 직접 상속권을 얻은 후순위 상속인, 유증을 받은 자, 실종자의 채권자·채무자·보증인 및 배우자가 포함됩니다.)" },
            { id: 21, article: "실종선고를 받아 사망으로 간주된 자는 실종선고가 취소되지 않는 한 반증을 통해 그 효력을 번복할 수 없다", answer: "O", reason: "실종선고에 의한 사망추정이 아닌 사망간주의 효력은 실종선고 취소절차를 거치지 않는 한 단순한 반증만으로 번복되지 않는다." },
            { id: 22, article: "실종선고 취소의 청구를받은 가정법원은 공시최고의 절차를 거칠 필요가 없다", answer: "O", reason: "공시최고의 절차는 실종선고시에만 필요하다" },
            { id: 23, article: "2인 이상이 동일한 위난으로 사망한 경우엔느 동시에 사망한 것으로 본다", answer: "X", reason: "본다>추정한다" },
            { id: 24, article: "피상속인과 그의 직계비속 또는 형제자매가 동시에 사망한 것으로 추정되는 경우에도 대습상속이 인정된다", answer: "O", reason: "대습상속=대신상속, 아들의 자녀나 배우자" },
            { id: 25, article: "사단법인의 하부조직 중 하나라 하더라도 스스로 단체의 실체를 갖추고 독자활동을 한다면 독립된 법인 아닌 사단으로 볼 수 있다", answer: "O", reason: "법인의 하부조직이라도 독자적인 규약과 대표자를 두고 독립된 단체로서 활동하면 비법인사단으로 인정될 수 있다." },
            { id: 26, article: "법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무를 주체가 된다는 민법 제34조는 정관이 있는 비법인사단에 유추적용할 수 있다", answer: "O", reason: "권리능력 없는 사단(비법인사단)도 대표자를 통해 목적 범위 내에서 권리·의무의 주체가 되므로 민법 제34조가 유추적용된다." },
            { id: 27, article: "대표권 없는 이사가 그 직무와 관련하여 타인에게 손해를 가한 경우, 법인의불법행위책임이 성립한다", answer: "X", reason: "대표권없는 이사에게 책임이 성립하지 않는 다. (사실상대표는 책임o)" },
            { id: 28, article: "법인의 책임이 성립하는 경우 특별한 사정이 없는 한 사원이 그 사항의 총회의결에 찬성했다는 사실만으로 법인과 연대책임이 부담하지는 않는다.", answer: "O", reason: "다만, 해당 사원의 행위가 찬성 의결을 넘어 독자적인 불법행위 요건(고의·과실, 위법성, 인과관계 등)을 직접 충족하는 등 특별한 사정이 있는 경우에만 예외적으로 사원 개인의 불법행위책임이 성립할 수 있습니다." },
            { id: 29, article: "비법인사단의 대표자가 외관상 객관적 직무에 관한 행위로 인정될 수 있으면 그의 행위가 직무에 관한것이 아님을 피해자가 중대한 사실로 알지 못 한 경우에도 비법인사단에게 손해배상책임을 물을 수 있다.", answer: "X", reason: "중대한 과실로 알지 못한 경우에는 책임을 물을 수 없다." },
            { id: 30, article: "재단법인의 정관변경은 그 변경방법을 정관에서 정한때에도 주무관청의 허가를 얻지 않으면 그 효력이 없다", answer: "O", reason: "재단법인의 정관변경은 정관에 변경방법이 규정되어 있더라도 주무관청의 허가를 얻지 않으면 효력이 없다(민법 제45조, 제46조)." },
            { id: 31, article: "이사의 변경등기는 대항요건이 아니라 효력발생요건이다.", answer: "X", reason: "효력발생요건이 아니라 대항요건이다. 효력발생요건 = \"우리 둘 사이에 권리가 생겼는가?\" (생성 여부) 대항요건 = \"생긴 권리를 남(제3자)한테도 주장할 수 있는가?\" (방어 여부)" },
            { id: 32, article: "사단법인의 사원의 지위를 양도 상속할 수 있다는 규약은 강행규정이 아니다", answer: "O", reason: "임의 규정이므로 정관으로 달리 정하는 것이 허용된다" },
            { id: 33, article: "사단법인의 사원의 지위는 양도 또는 상속할 수 없고 이는 정관으로 달리 정할 수 없다", answer: "X", reason: "임의 규정이므로 정관으로 달리 정하는 것이 허용된다" },
            { id: 34, article: "사단법인 이사의 대표권 제한은 등기되어 있지 않았다고 하더라고 정관에 그 기재가 있는 한 악의의 제3자에게 대항할 수 있다.", answer: "X", reason: "등기하지않으면 악의의 제3자에게 대항할 수 없다" },
            { id: 35, article: "이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못하는 민법 제60조는 정ㅈ관에 있는 비법인사단에도 유추적용할 수 없다", answer: "O", reason: "비법인사단은 등기 능력이 없어 대표권 제한을 등기할 수 없으므로, 민법 제60조(등기하지 않은 대표권 제한의 대항 불가)는 유추적용되지 않는다." },
            { id: 36, article: "법인 사단은 대표권제한을 등기할 수 없으므로 거래상대방이 사원총회가 대표권 제한을 결의한 사실을 몰랐고 모른데 잘못이 없으면,제한을넘는 이사의 거래행위는 유효하다", answer: "O", reason: "비법인사단의 대표권 제한은 등기할 수 없으므로, 상대방이 선의·무과실인 경우 그 대표권 제한을 이유로 무효를 주장할 수 없어 거래행위는 유효하다." },
            { id: 37, article: "이사에 의해 선임된 대리인은 법인의 대표기관이 아니다", answer: "O", reason: "이사가 선임한 대리인은 특정 행위에 대한 대리인일 뿐 법인의 기관(대표기관)이 아니다." },
            { id: 38, article: "이사의 선임에 관한 민법 제63조는 비법인사단에 유추적용될 수 없다", answer: "X", reason: "63조는 임시이사선임에 관한 규정" },
            { id: 39, article: "특별대리인은 임시기관으로 법인의 대표기관이다", answer: "O", reason: "특별대리인은 법인과 이사의 이익이 상반하는 사항 등에 대해 법인을 대표하는 임시 대표기관이다(민법 제64조)." },
            { id: 40, article: "소집절차에 하자 있어 그 효력을 인정할 수 없는 종중총회의 결의라도 후에 적법하게 소집된 종중총회에서 이를 추인하면 처음부터 유효로 된다.", answer: "O", reason: "소집절차의 하자로 무효인 종중총회 결의라도 나중에 적법하게 소집된 종중총회에서 추인하면 소급하여 유효로 된다." },
            { id: 41, article: "이사회에서 어느 이사와의 관계사항을 의결하는 경우, 그 이사는 의사 정족 수 산정의 기초가 되는 이사의 수에 포함된다", answer: "O", reason: "특별이해관계가 있는 이사는 '의결권' 행사에는 배제되나, 전체 이사 수를 기준으로 하는 '의사정족수' 산정의 기초가 되는 이사 수에는 포함된다." },
            { id: 42, article: "권원 없이 타인의 토지에 심으 수목은 독립한 물권의 객체가 될 수 없다", answer: "O", reason: "정당한 권원 없이 타인의 토지에 심은 수목은 토지에 부합하므로 토지 소유자의 소유가 되며 독립한 물권의 객체가 되지 못한다." },
            { id: 43, article: "관리할 수 있는 자연력은 동산이다", answer: "O", reason: "민법 제98조에 따라 전기, 가스 등 관리할 수 있는 자연력은 동산으로 본다." },
            { id: 44, article: "종물은 주물소유자의 상용에 공여된 물건을 말한다", answer: "X", reason: "주물 소유자일필요는 없다" },
            { id: 45, article: "독립한 부동산은 종물이 될 수 없다", answer: "X", reason: "독립한 부동산도 종물이 될 수 있다" },
            { id: 46, article: "구분건물의 전유부분에 대한 가 압류 결정의 효력은 특별한 사정이 없는 한 그 대지권에 미치지 않는다.", answer: "X", reason: "대지권의 종된 권리성 및 일체성" },
            { id: 47, article: "부첩관계의 종료를 해제조건으로 하는 증여계약은 그 조건뿐만 아니라 그 계약자체도 무효이다", answer: "O", reason: "조건이 반사회질서의 법률행위(민법 제103조)에 해당하는 불법조건인 경우, 조건만 무효가 되는 것이 아니라 그 법률행위(계약) 전체가 무효" },
            { id: 48, article: "위증하기로 하는 계약은 당사자가 무효임을 알고 추인하여도 유효로 될 수 없다.", answer: "O", reason: "위증을 조건으로 한 계약은 반사회적 법률행위(제103조)로서 절대적 무효이므로, 당사자가 추인하더라도 유효로 될 수 없다." },
            { id: 49, article: "이중매매임을 알고 부동산을 매수한 것만으로 제2매매가 사회질서에 반하여 무효인 것은 아니다.", answer: "O", reason: "제2매수인이 알고 적극가담한 경우 무효/단순히 알고 매수한것만으로는 반사회질서 법률행위로서 무효가 되지 않는다" },
            { id: 50, article: "비자금은 소극적으로 은닉하기 위하여 임치한 것은 사회질서에 반하는 법률행위로 볼 수 없다", answer: "O", reason: "비자금을 형성한 행위 자체는 불법이더라도 이를 단순히 은닉하기 위해 임치(보관)한 행위까지 반사회적 법률행위로 볼 수 없다." },
            { id: 51, article: "강제집행을 면할 목적으로 부동산에 허위의 근저당권설정등기를 경료하는 행위는 민법 제103조의 선량한 풍속 기타 사회질서에 위반한 사항을  내용으로 하는 법률행위이다.", answer: "X", reason: "강제집행을 면할 목적으로 허위의 근저당권을 설정하는 행위는 통정허위표시(제108조)로서 무효일 뿐, 반사회적 법률행위(제103조)에는 해당하지 않는다." },
            { id: 52, article: "대리인에 의하여 행해진 법률행위에서 불공정한 법률행위가 문제되는 경우, 경솔이나 무경험은 대리인을 기준으로 판단한다.", answer: "O", reason: "대리인에 의한 법률행위 시 궁박은 '본인'을 기준으로 판단하고, 경솔과 무경험은 '대리인'을 기준으로 판단한다." },
            { id: 53, article: "대리인에 의한 법률행위가 불공정한 법률행위에 해당하는지 판단함에 있어서 궁박은 대리인을 기준으로 한다", answer: "X", reason: "궁박만 본인을 기준으로한다" },
            { id: 54, article: "경매목적물과 매각대금이 현저하게 공정을 잃은 경우에는 그 경매는 불공정한 법률행위에 해당하지 않는다", answer: "O", reason: "경매는 법률의 규정에 의한 국가기관의 처분이므로 민법 제104조(불공정한 법률행위)가 적용되지 않는다." },
            { id: 55, article: "매매계약이 약정된 매매대금의 과다로 인하여 불공정한 법률행위에 해당하는 경우 무효행위의 전환에 관한 민법 제138조가 적용될 수 없다.", answer: "X", reason: "민법 제 138조 , 무효인 법률행위라도 당사자가 그 무효를 알았더라면 '다른 법률행위'를 했을 것으로 인정될 때, 그 다른 법률행위로서의 효력을 인정해 주는 제도입니다." },
            { id: 56, article: "사실인 관습은 법령으로서의 효력이 없고, 법률행위 당사자의 의사를 보충함에 그친다.", answer: "O", reason: "사실인 관습은 법원(FA원)인 관습법과 달리 법적 규범력이 없으며, 당사자의 의사가 명확하지 않을 때 의사를 보충하는 수단에 그친다." },
            { id: 57, article: "통정허위표시에 의한 급부는 특별한 사정이 없는한 불법원인급여이다", answer: "X", reason: "통정허위표시 자체는 불법원인급여가 아닙니다" },
            { id: 58, article: "선의의 제3자에 대해서는 통정허위표시의 당사자 뿐만 아니라 그 누구도 통정허위표시의 무효로 대항할 수 없다", answer: "O", reason: "통정허위표시의 무효는 '선의의 제3자'에게 대항하지 못하며(제108조 제2항), 이는 당사자뿐만 아니라 누구나 그 선의의 제3자에 대해 무효를 주장할 수 없음을 의미한다." },
            { id: 59, article: "통정허위표시의 무효로 대항할 수 없는 제3자는 허위표시의 당사자와 그의 포괄승계인 이외의 자로서 허위표시행위를 기초로 하여 새로운 이해관계를 맺은 자를 말한다", answer: "O", reason: "통정허위표시의 무효로 대항할 수 없는 제3자란 당사자와 포괄승계인 이외의 자로서 허위표시에 의해 형성된 법률관계를 바탕으로 새로운 법률상 이해관계를 맺은 자를 말한다." },
            { id: 60, article: "통정허위표시에서 파산관재인은 제3자에 해당하지 않는다", answer: "X", reason: "파산관제인은 제3자에 해당한다. (참고: 파산관재인의 선의 악의는 파산관재인 개인 기준으로 하는것이 아니라 파산채권자 전체를 기준으로 판단한다. 단 한명이라도 선의라면 파산관재인은 선의의제3자로 보호받는다" },
            { id: 61, article: "가장의 채권양도 후 채무가 변제되지 않고 있는 동안 채권양도가 허위임이 밝혀진 경우에 있어서는 채무자는 통정허위표시에 의하여 외형상 형성된 법률관계를 기초로 하여 새로운 법률상 이해관계를 맺은 제3자에 해당하지 않는다.", answer: "O", reason: "원래부터 빚을 지고 있던 채무자는 가짜 채권양도가 일어났다고 해서 새로 거래를 한 사람이 아니므로, 보호받는 제3자가 아니다" },
            { id: 62, article: "어떠한 법률행위가 정지조건부 법률행위에 해당한다는 사실은 그 법률행위로 인한 법률효과의 발생을 저지하는 사유로서 그 법률효과의 발생을 다투려는 자에게 주장·증명책임이 있다.", answer: "O", reason: "조건의 존재를 주장하여 법률효과의 발생을 다투는 자에게 증명책임이 있습니다." },
            { id: 63, article: "취소권은 법률행위를 한 날부터 10년 내에, 추인할 수 있는 날부터 3년 내에 행사하여야 한다.", answer: "O", reason: "민법 제146조(취소권의 소멸) 규정에 부합합니다." },
            { id: 64, article: "취소할 수 있는 법률행위의 상대방이 확정되어 있는 경우에는 그 취소는 그 상대방에 대한 의사표시로 하여야 한다.", answer: "O", reason: "민법 제142조 규정에 따라 상대방에 대한 의사표시로 취소합니다." },
            { id: 65, article: "대리인이 한 법률행위의 효과는 본인에게 직접 귀속한다.", answer: "O", reason: "민법 제114조 제1항에 따라 대리행위의 법률효과는 본인에게 직접 귀속됩니다." },
            { id: 66, article: "대리권 없는 자가 타인의 대리인으로 한 계약은 본인이 이를 추인하지 아니하면 본인에 대하여 효력이 없다.", answer: "O", reason: "민법 제130조 무권대리 규정에 해당합니다." },
            { id: 67, article: "무권대리행위의 추인은 다른 의사표시가 없는 한 계약시에 소급하여 그 효력이 생긴다. 그러나 제3자의 권리를 해하지 못한다.", answer: "O", reason: "민법 제133조에 명시되어 있습니다." },
            { id: 68, article: "소멸시효는 권리를 행사할 수 있는 때로부터 진행한다.", answer: "O", reason: "민법 제166조 제1항 규정에 맞습니다." },
            { id: 69, article: "시효중단의 효력은 당사자 및 그 승계인간에만 미친다.", answer: "O", reason: "민법 제169조 상대적 효력의 원칙입니다." },
            { id: 70, article: "소멸시효는 법률행위에 의하여 이를 배제, 연장 또는 중화할 수 없으나 단축 또는 경감할 수 있다.", answer: "O", reason: "민법 제184조 제2항에 명시된 내용입니다." },
            { id: 71, article: "물권은 법률 또는 관습법에 의하는 외에는 임의로 창설하지 못한다.", answer: "O", reason: "민법 제185조 물권법정주의 규정입니다." },
            { id: 72, article: "부동산에 관한 법률행위로 인한 물권의 득실변경은 등기하여야 그 효력이 생긴다.", answer: "O", reason: "민법 제186조 부동산물권변동의 성립요건주의입니다." },
            { id: 73, article: "동산에 관한 물권의 양도는 그 동산을 인도하여야 효력이 생긴다.", answer: "O", reason: "민법 제188조 제1항 동산물권변동 규정입니다." },
            { id: 74, article: "점유자가 점유물에 대하여 행사하는 권리는 적법하게 보유한 것으로 추정한다.", answer: "O", reason: "민법 제200조 점유의 권리적복추정 규정입니다." },
            { id: 75, article: "20년간 소유의 의사로 평온, 공연하게 부동산을 점유하는 자는 등기함으로써 그 소유권을 취득한다.", answer: "O", reason: "민법 제245조 제1항 점유취득시효 규정입니다." },
            { id: 76, article: "부동산의 소유자로 등기한 자가 10년간 소유의 의사로 평온, 공연하게 선의이며 과실없이 그 부동산을 점유한 때에는 소유권을 취득한다.", answer: "O", reason: "민법 제245조 제2항 등기부취득시효 규정입니다." },
            { id: 77, article: "공유자는 그 지분을 처분할 수 있고 공유물 전부를 지분의 비율로 사용, 수익할 수 있다.", answer: "O", reason: "민법 제263조 공유자의 지분처분과 공유물 사용·수익 규정입니다." },
            { id: 78, article: "공유자는 다른 공유자의 동의없이 공유물을 변경하지 못한다.", answer: "O", reason: "민법 제264조 공유물의 처분·변경 제한 규정입니다." },
            { id: 79, article: "공유물의 관리에 관한 사항은 공유자의 지분의 과반수로써 결정한다. 그러나 보존행위는 각자가 할 수 있다.", answer: "O", reason: "민법 제265조 공유물의 관리, 보존 규정입니다." },
            { id: 80, article: "지상권자는 타인의 토지에 건물 기타 공작물이나 수목을 소유하기 위하여 그 토지를 사용하는 권리가 있다.", answer: "O", reason: "민법 제279조 지상권의 내용 규정입니다." },
            { id: 81, article: "전세권자는 전세금을 지급하고 타인의 부동산을 점유하여 그 부동산의 용도에 따라 사용·수익하며, 그 부동산 전부에 대하여 후순위권리자 기타 채권자보다 전세금의 우선변제를 받을 권리가 있다.", answer: "O", reason: "민법 제303조 제1항 전세권의 내용 규정입니다." },
            { id: 82, article: "유치권자는 채권의 변제를 받을 때까지 그 물건 또는 유가증권을 유치할 권리가 있다.", answer: "O", reason: "민법 제320조 제1항 유치권의 내용 규정입니다." },
            { id: 83, article: "저당권자는 채무자 또는 제3자가 점유를 이전하지 아니하고 채무의 담보로 제공한 부동산에 대하여 다른 채권보다 자기채권의 우선변제를 받을 권리가 있다.", answer: "O", reason: "민법 제356조 저당권의 내용 규정입니다." },
            { id: 84, article: "채무불이행으로 인한 손해배상권은 원채권의 확장으로서 소멸시효는 원채권이 발생한 때부터 진행한다.", answer: "X", reason: "채무불이행으로 인한 손해배상청구권의 소멸시효는 '채무불이행시(원래의 채권이 이행불능이 된 때)'부터 진행합니다." },
            { id: 85, article: "법률행위의 취소 권능만을 법률행위와 분리하여 양도할 수 있다.", answer: "X", reason: "취소권은 형성권으로서 취소할 수 있는 법률행위상의 지위와 분리하여 취소권만을 양도할 수 없습니다." },
            { id: 86, article: "당사자가 조건성취의 효력을 그 성취전에 소급하게 할 의사를 표시한 때에도 그 효력은 소급하지 않는다.", answer: "X", reason: "민법 제127조 제3항에 따라 당사자가 소급효 의사를 표시한 때에는 그 의사에 따라 소급합니다." },
            { id: 87, article: "제3자의 강박으로 인하여 상대방 있는 의사표시를 한 경우, 상대방이 그 사실을 알지 못한 경우에도 표의자는 항상 취소할 수 있다.", answer: "X", reason: "상대방 있는 의사표시에서 제3자의 강박이 있었던 경우, 상대방이 그 사실을 '알았거나 알 수 있었을 경우'에 한하여 취소할 수 있습니다." },
            { id: 88, article: "대리권 수여의 의사표시에 의한 표현대리는 법정대리에도 적용된다.", answer: "X", reason: "민법 제125조의 대리권 수여 표시 표현대리는 본인이 대리권을 수여함을 표시한 경우에만 성립하므로 '임의대리'에만 적용되고 법정대리에는 적용되지 않습니다." },
            { id: 89, article: "권리남용에 해당하려면 주관적으로 남용의 의사가 있어야 하며, 객관적 사정만으로는 판단할 수 없다.", answer: "X", reason: "권리남용은 권리행사가 사회질서에 위반되는지 여부 등 객관적 사정을 종합하여 판단하며, 판례는 예외적으로 주관적 의사 없이도 객관적 사정만으로 권리남용을 인정하는 경우가 있습니다." },
            { id: 90, article: "재단법인의 설립행위는 상대방 있는 단독행위이다.", answer: "X", reason: "재단법인 설립행위는 상대방 없는 단독행위입니다." },
            { id: 91, article: "법인의 대표자가 그 직무에 관하여 타인에게 손해를 가한 때에는 법인만 손해배상책임을 지고 대표자 개인은 책임을 면한다.", answer: "X", reason: "민법 제35조 제1항 단서에 따라 대표자 개인도 법인과 불법행위로 인한 손해배상책임을 연대하여 집니다." },
            { id: 92, article: "소멸시효 완성 후 채무를 일부분 변제한 경우, 시효완성의 사실을 알고 포기한 것으로 추정하지 않는다.", answer: "X", reason: "시효완성 후 채무의 일부를 변제하거나 승인한 경우 특별한 사정이 없는 한 시효이익을 포기한 것으로 추정합니다." },
            { id: 93, article: "점유개정에 의한 점유취득으로도 동산의 선의취득이 인정된다.", answer: "X", reason: "점유개정에 의한 인도 방식으로는 동산 선의취득을 할 수 없다는 것이 판례의 확립된 입장입니다." },
            { id: 94, article: "부동산 간주점유자는 등기부취득시효를 주장할 수 없다.", answer: "X", reason: "간주점유자(간접점유자)도 점유권을 가진 자이므로 취득시효의 점유 요건을 충족할 수 있습니다." },
            { id: 95, article: "공유토지의 특정 일부분을 배타적으로 사용·수익하는 공유자는 다른 공유자에 대하여 부당이득반환의무를 지지 않는다.", answer: "X", reason: "자신의 지분 범위를 초과하여 배타적으로 사용·수익하는 경우 다른 공유자의 지분권에 해당하는 임대료 상당액을 부당이득으로 반환해야 합니다." },
            { id: 96, article: "지역권은 요역지와 분리하여 양도하거나 다른 권리의 목적으로 할 수 있다.", answer: "X", reason: "민법 제292조 제1항에 따라 지역권은 요역지와 분리하여 양도하거나 다른 권리의 목적으로 하지 못합니다(부종성)." },
            { id: 97, article: "전세권이 성립한 후 목적물의 소유권이 이전된 경우, 구 소유자가 전세금반환의무를 부담한다.", answer: "X", reason: "전세권은 물권이므로 소유권 이전 시 신 소유자가 전세권 설정자의 지위를 승계하여 전세금반환의무를 부담합니다." },
            { id: 98, article: "유치권자에게는 우선변제권과 물상대위성이 인정된다.", answer: "X", reason: "유치권은 점유를 통해 변제를 간접 강제할 뿐 우선변제권과 물상대위성이 인정되지 않습니다." },
            { id: 99, article: "저당권의 효력은 저당부동산에 부합된 물건과 종물에는 미치지 아니한다.", answer: "X", reason: "민법 제358조에 따라 저당권의 효력은 저당부동산에 부합된 물건과 종물에 미칩니다." },
            { id: 100, article: "지상권자가 1년간 지료를 지급하지 아니한 때에는 지상권설정자는 지상권의 소멸을 청구할 수 있다.", answer: "X", reason: "민법 제287조에 따라 지상권자가 '2년 이상' 지료를 연체한 때에 지상권 소멸을 청구할 수 있습니다." },
            { id: 101, article: "근저당권에서 채권최고액은 근저당권자가 변제받을 수 있는 한도액이 아니라 책임의 한도액을 의미한다.", answer: "X", reason: "채권최고액은 우선변제를 받을 수 있는 최고한도액을 의미하며, 채무자의 책임한도액을 의미하는 것이 아닙니다." }
        ];

        let rawDeck = loadStoredDeck();
        let currentDeck = [...rawDeck];
        let currentIndex = 0;
        let isFlipped = false;
        let currentFilter = 'ALL';
        const userAnswers = loadStoredAnswers();

        const flashcard = document.getElementById('flashcard');
        const cardContainer = document.getElementById('cardContainer');
        const articleText = document.getElementById('articleText');
        const reasonText = document.getElementById('reasonText');
        const correctAnswerDisplay = document.getElementById('correctAnswerDisplay');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const resultBadge = document.getElementById('resultBadge');
        const cardBadge = document.getElementById('cardBadge');
        const btnAnswerO = document.getElementById('btnAnswerO');
        const btnAnswerX = document.getElementById('btnAnswerX');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');

        function loadStoredDeck() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_DECK);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch(e) {
                console.error("저장된 문제 덱 로드 실패:", e);
            }
            return [...defaultDeck];
        }

        function loadStoredAnswers() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_ANSWERS);
                if (saved) return JSON.parse(saved);
            } catch(e) {
                console.error("저장된 답안 히스토리 로드 실패:", e);
            }
            return {};
        }

        function saveDeckToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_DECK, JSON.stringify(rawDeck));
            } catch(e) {
                console.error("문제 덱 저장 실패:", e);
            }
        }

        function saveAnswersToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
            } catch(e) {
                console.error("답안 히스토리 저장 실패:", e);
            }
        }

        function resetToDefaultDeck() {
            if (confirm("기본 문제 덱으로 초기화하고 풀이 기록을 지우시겠습니까?")) {
                localStorage.removeItem(STORAGE_KEY_DECK);
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                rawDeck = [...defaultDeck];
                for (let key in userAnswers) delete userAnswers[key];
                saveDeckToStorage();
                saveAnswersToStorage();
                setFilter('ALL');
            }
        }

        // 🎲 Fisher-Yates 카드 셔플 함수
        function shuffleDeck() {
            if (currentDeck.length <= 1) {
                alert("섞을 카드가 2개 이상이어야 합니다.");
                return;
            }

            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }

            currentIndex = 0;
            renderCard();
        }

        function getCardKey(card) {
            return card.id || `card-${card.article}`;
        }

        cardContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;

            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.classList.add('rotate-y-180');
            } else {
                flashcard.classList.remove('rotate-y-180');
            }
        });

        function renderCard() {
            updateFilterCounts();

            if (currentDeck.length === 0) {
                articleText.textContent = "해당하는 카드가 없습니다.";
                reasonText.textContent = "";
                correctAnswerDisplay.textContent = "";
                progressText.textContent = "0 / 0";
                progressBar.style.width = '0%';
                cardBadge.textContent = "";
                resultBadge.className = "hidden";
                btnAnswerO.disabled = true;
                btnAnswerX.disabled = true;
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            btnAnswerO.disabled = false;
            btnAnswerX.disabled = false;

            if (isFlipped) {
                unflipCardSilently();
            }

            const currentCard = currentDeck[currentIndex];
            articleText.textContent = currentCard.article || "지문 내용이 없습니다.";
            reasonText.textContent = currentCard.reason || "상세 해설이 없습니다.";
            
            const rawAns = (currentCard.answer || "O").trim().toUpperCase();
            correctAnswerDisplay.textContent = rawAns === 'O' ? "O (옳은 지문)" : "X (틀린 지문)";
            
            if (rawAns === 'O') {
                correctAnswerDisplay.className = "text-2xl font-black text-emerald-400";
            } else {
                correctAnswerDisplay.className = "text-2xl font-black text-rose-400";
            }

            const key = getCardKey(currentCard);
            const pastAnswer = userAnswers[key];
            if (pastAnswer) {
                showResultBadge(pastAnswer.isCorrect, pastAnswer.userAns);
            } else {
                resultBadge.className = "hidden";
            }

            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === currentDeck.length - 1;

            const total = currentDeck.length;
            const currentNum = currentIndex + 1;
            progressText.textContent = `${currentNum} / ${total}`;
            progressBar.style.width = `${(currentNum / total) * 100}%`;
            cardBadge.textContent = `No. ${currentCard.id || currentNum}`;
        }

        function unflipCardSilently() {
            isFlipped = false;
            correctAnswerDisplay.textContent = "";
            reasonText.textContent = "";

            flashcard.style.transition = 'none';
            flashcard.classList.remove('rotate-y-180');
            
            void flashcard.offsetHeight;
            flashcard.style.transition = '';
        }

        function showResultBadge(isCorrect, userAns) {
            resultBadge.classList.remove('hidden');
            if (isCorrect) {
                resultBadge.textContent = `정답! (내가 택한 답: ${userAns})`;
                resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200";
            } else {
                resultBadge.textContent = `오답 (내가 택한 답: ${userAns})`;
                resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-100 text-rose-700 border border-rose-200";
            }
        }

        function submitAnswer(userAns) {
            if (currentDeck.length === 0) return;
            const currentCard = currentDeck[currentIndex];
            const rawAns = (currentCard.answer || "O").trim().toUpperCase();
            const isCorrect = userAns === rawAns;

            const key = getCardKey(currentCard);
            userAnswers[key] = { isCorrect, userAns };
            saveAnswersToStorage();

            showResultBadge(isCorrect, userAns);

            if (!isFlipped) {
                isFlipped = true;
                flashcard.classList.add('rotate-y-180');
            }

            updateFilterCounts();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function resetCurrentCardState() {
            if (currentDeck.length === 0) return;
            const currentCard = currentDeck[currentIndex];
            const key = getCardKey(currentCard);
            delete userAnswers[key];
            saveAnswersToStorage();
            renderCard();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            const btnAll = document.getElementById('filterAll');
            const btnInc = document.getElementById('filterIncorrect');
            const btnUnans = document.getElementById('filterUnanswered');

            const activeClass = "px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 transition-all";
            const inactiveClass = "px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all";

            btnAll.className = filterType === 'ALL' ? activeClass : inactiveClass;
            btnInc.className = filterType === 'INCORRECT' ? activeClass : inactiveClass;
            btnUnans.className = filterType === 'UNANSWERED' ? activeClass : inactiveClass;

            applyFilter();
        }

        function applyFilter() {
            if (currentFilter === 'ALL') {
                currentDeck = [...rawDeck];
            } else if (currentFilter === 'INCORRECT') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return ans && !ans.isCorrect;
                });
            } else if (currentFilter === 'UNANSWERED') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return !ans;
                });
            }

            currentIndex = 0;
            renderCard();
        }

        function updateFilterCounts() {
            document.getElementById('countAll').textContent = rawDeck.length;

            let incCount = 0;
            let unansCount = 0;

            rawDeck.forEach(card => {
                const ans = userAnswers[getCardKey(card)];
                if (!ans) unansCount++;
                else if (!ans.isCorrect) incCount++;
            });

            document.getElementById('countIncorrect').textContent = incCount;
            document.getElementById('countUnanswered').textContent = unansCount;
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                let text = "";

                try {
                    const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                    text = utf8Decoder.decode(buffer);
                } catch (err) {
                    try {
                        const eucKrDecoder = new TextDecoder('euc-kr');
                        text = eucKrDecoder.decode(buffer);
                    } catch (eucErr) {
                        const ansiDecoder = new TextDecoder('iso-8859-1');
                        text = ansiDecoder.decode(buffer);
                    }
                }

                parseCSVData(text);
            };
            
            reader.readAsArrayBuffer(file);
        }

        function parseCSVData(text) {
            const lines = text.split(/\r\n|\n/);
            const parsed = [];
            let isHeader = true;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const tokens = parseCSVLine(line);
                if (tokens.length < 2) continue;

                if (isHeader && (tokens[0].includes("지문") || tokens[0].includes("question") || tokens[0].toLowerCase().includes("article"))) {
                    isHeader = false;
                    continue;
                }
                isHeader = false;

                const article = tokens[0] ? tokens[0].trim() : "";
                const answer = tokens[1] ? tokens[1].trim().toUpperCase() : "O";
                const reason = tokens[2] ? tokens[2].trim() : "해설이 제공되지 않았습니다.";

                if (article) {
                    parsed.push({
                        id: parsed.length + 1,
                        article,
                        answer,
                        reason
                    });
                }
            }

            if (parsed.length > 0) {
                rawDeck = parsed;
                for (let key in userAnswers) delete userAnswers[key];
                
                saveDeckToStorage();
                saveAnswersToStorage();

                setFilter('ALL');
                alert(`성공적으로 ${parsed.length}개의 OX 문제를 불러왔으며 브라우저에 자동 저장되었습니다!`);
            } else {
                alert("CSV 파일에서 유효한 문제 데이터를 찾지 못했습니다. 템플릿 양식을 확인해 주세요.");
            }
        }

        function parseCSVLine(text) {
            const delimiter = text.includes('\t') ? '\t' : ',';
            const result = [];
            let cur = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === delimiter && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result.map(str => str.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function downloadCSVTemplate() {
            const csvContent = "\uFEFF지문,정답,해설\n" +
                "\"독립한 부동산은 종물이 될 수 없다.\",X,\"독립된 건물이라도 주물의 효용을 돕는다면 종물이 될 수 있습니다.\"\n" +
                "\"부첩관계의 종료를 해제조건으로 하는 증여계약은 무효이다.\",O,\"불륜관계 유지를 강요하는 불법조건이므로 무효입니다.\"\n" +
                "\"이중매매임을 알고 매수한 것만으로 무효가 되지는 않는다.\",O,\"단순 악의만으로는 유효하며, 적극 가담해야 무효가 됩니다.\"";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "민법_OX_플래시카드_템플릿.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderCard();
    </script>
