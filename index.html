<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민법 OX 플래시카드 - 스마트 학습기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-between p-4 font-sans text-slate-800">

    <header class="w-full max-w-2xl mx-auto mb-4 flex flex-col sm:flex-row justify-between items-center gap-3 bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-sm flex items-center justify-center">
                <i class="fa-solid fa-book-bookmark text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-slate-900 tracking-tight">민법 OX 플래시카드</h1>
                <p class="text-xs text-slate-500">판례 및 조문 암기 도우미</p>
            </div>
        </div>

        <!-- Controls: Shuffle, Reset, CSV Upload, Template Download -->
        <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-wrap">
            <button onclick="shuffleDeck()" title="현재 카드를 무작위로 섞습니다" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-xl transition-all border border-indigo-200 active:scale-95">
                <i class="fa-solid fa-shuffle"></i>
                <span>카드 섞기</span>
            </button>
            <button onclick="resetToDefaultDeck()" title="기본 문제 덱으로 초기화" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 rounded-xl transition-all border border-rose-200 active:scale-95">
                <i class="fa-solid fa-rotate-left"></i>
                <span>초기화</span>
            </button>
            <button onclick="downloadCSVTemplate()" title="CSV 템플릿 다운로드" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-all border border-slate-200">
                <i class="fa-solid fa-file-csv text-indigo-600"></i>
                <span>템플릿</span>
            </button>
            <label for="csvFileInput" class="flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:scale-95 rounded-xl cursor-pointer shadow-sm transition-all">
                <i class="fa-solid fa-file-import"></i>
                <span>CSV 업로드</span>
            </label>
            <input type="file" id="csvFileInput" accept=".csv, .tsv, .txt" class="hidden" onchange="handleCSVUpload(event)">
        </div>
    </header>

    <main class="w-full max-w-2xl mx-auto flex-1 flex flex-col justify-center">
        
        <!-- Filter & Progress Container -->
        <div class="mb-4 bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-3">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-filter text-xs text-indigo-500"></i>
                    <span class="text-xs font-bold text-slate-600">필터:</span>
                </div>
                <div class="flex items-center gap-1.5 overflow-x-auto text-xs font-medium">
                    <button id="filterAll" onclick="setFilter('ALL')" class="px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 transition-all">전체 (<span id="countAll">0</span>)</button>
                    <button id="filterIncorrect" onclick="setFilter('INCORRECT')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">틀린 지문 (<span id="countIncorrect">0</span>)</button>
                    <button id="filterUnanswered" onclick="setFilter('UNANSWERED')" class="px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all">미풀이 (<span id="countUnanswered">0</span>)</button>
                </div>
            </div>

            <!-- Progress Info -->
            <div class="flex justify-between items-center">
                <span id="progressText" class="text-sm font-semibold text-slate-700">0 / 0</span>
                <span id="resultBadge" class="hidden text-xs font-bold px-3 py-1 rounded-full shadow-sm"></span>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden border border-slate-200">
                <div id="progressBar" class="bg-indigo-600 h-full w-0 transition-all duration-300 rounded-full"></div>
            </div>
        </div>

        <div class="perspective-1000 w-full h-80 cursor-pointer my-2" id="cardContainer">
            <div id="flashcard" class="relative w-full h-full transform-style-3d transition-transform duration-500 rounded-3xl shadow-lg border border-slate-200/80 bg-white">
                
                <!-- Front Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-white rounded-3xl">
                    <div class="flex justify-between items-center w-full">
                        <span class="text-xs font-bold tracking-wider text-indigo-600 uppercase bg-indigo-50 border border-indigo-100 px-3 py-1 rounded-full">지문</span>
                        <span id="cardBadge" class="text-xs text-slate-400 font-medium"></span>
                    </div>
                    
                    <p id="articleText" class="text-base sm:text-lg font-semibold text-slate-800 break-keep leading-relaxed my-auto max-h-48 overflow-y-auto no-scrollbar w-full px-2">
                        질문을 불러오는 중입니다...
                    </p>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-100">
                        <i class="fa-solid fa-rotate text-indigo-400"></i>
                        <span>카드를 클릭하면 정답과 해설이 뒤집힙니다</span>
                    </div>
                </div>

                <!-- Back Side -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-6 sm:p-8 flex flex-col justify-between items-center text-center bg-slate-900 text-white rounded-3xl shadow-inner">
                    <div class="flex flex-col items-center gap-1">
                        <span class="text-xs font-bold tracking-wider text-slate-400 uppercase bg-slate-800 px-3 py-1 rounded-full border border-slate-700">정답 해설</span>
                        <div id="correctAnswerDisplay" class="text-3xl font-black mt-1"></div>
                    </div>
                    
                    <div class="overflow-y-auto max-h-36 my-auto w-full px-2 no-scrollbar">
                        <p id="reasonText" class="text-sm sm:text-base text-slate-200 leading-relaxed break-keep font-medium"></p>
                    </div>
                    
                    <div class="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                        <i class="fa-solid fa-rotate text-slate-400"></i>
                        <span>카드를 클릭하면 지문으로 돌아갑니다</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- OX Answer Buttons -->
        <div class="grid grid-cols-2 gap-4 mt-4">
            <button id="btnAnswerO" onclick="submitAnswer('O')" class="py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-regular fa-circle text-2xl"></i>
                <span>맞음 (O)</span>
            </button>
            <button id="btnAnswerX" onclick="submitAnswer('X')" class="py-4 bg-rose-500 hover:bg-rose-600 active:scale-95 text-white font-extrabold text-2xl rounded-2xl shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-xmark text-2xl"></i>
                <span>틀림 (X)</span>
            </button>
        </div>

        <!-- Navigation Buttons -->
        <div class="flex justify-between items-center mt-4 gap-4">
            <button id="btnPrev" onclick="prevCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <i class="fa-solid fa-chevron-left"></i>
                <span>이전 카드</span>
            </button>
            <button id="btnResetCurrent" onclick="resetCurrentCardState()" class="px-3 py-3 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-600 font-semibold rounded-xl text-xs shadow-sm transition-all" title="이 카드의 학습 기록 초기화">
                <i class="fa-solid fa-arrows-rotate"></i>
            </button>
            <button id="btnNext" onclick="nextCard()" class="flex-1 py-3 bg-white border border-slate-300 hover:bg-slate-50 active:scale-95 text-slate-700 font-bold rounded-xl text-sm shadow-sm transition-all disabled:opacity-40 disabled:pointer-events-none flex items-center justify-center gap-2">
                <span>다음 카드</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </main>

    <footer class="w-full max-w-2xl mx-auto mt-6 text-center text-xs text-slate-400">
        민법 OX 플래시카드 &copy; Smart Study App
    </footer>

    <script>
        const STORAGE_KEY_DECK = "civil_law_quiz_deck_v4";
        const STORAGE_KEY_ANSWERS = "civil_law_quiz_answers_v4";

        // 166개 문항 기본 내장 데이터
        const defaultDeck = [
            { id: 1, article: "무권대리인이 무권대리행위 후 단독으로 본인의 지위를 상속한 경우, 본인의 지위에서 그 무권대리행위의 추인을 거절하는 것은 신의칙에 반한다", answer: "O", reason: "무권대리인이 본인을 단독상속한 후 자신이 한 무권대리행위의 추인을 거절하는 것은 금반언의 원칙 및 신의칙에 반하여 허용되지 않는다." },
            { id: 2, article: "권리남용금지의 원칙은 본래적 의미의 권리뿐만 아니라 법인격의 남용에도 적용된다", answer: "O", reason: "권리남용금지의 원칙(민법 제2조 제2항)은 일반적인 권리행사뿐만 아니라 법인격을 악용하는 법인격 남용의 경우에도 적용된다." },
            { id: 3, article: "강행법규를 위반한 자가 스스로 강행법규 위반을 이유로 약정의 무효를 주장하는 것은 특별한 사정이 없는 한 신의칙에 반한다.", answer: "X", reason: "신의칙에 반하지 않는다" },
            { id: 4, article: "현행 민법은 태아의 권리능력에 관하여 일반적 보호주의를 취한다", answer: "X", reason: "개별적 보호주의를 취한다" },
            { id: 5, article: "태아는 불법행위로 인한 손해배상청구권에 관하여 이미 출생한 것으로 추정한다", answer: "X", reason: "추정한다> 본다" },
            { id: 6, article: "행위능력제도는 자기책임의 원칙을 구현하여 거래의 안전을 도모하기 위한 것이다", answer: "X", reason: "미성년자의 개인의 이익을 보호하는 민법의 근본결단" },
            { id: 7, article: "유언행위는 16세인 미성년자가 단독으로 유효하게 할 수 없는 법률행위이다", answer: "O", reason: "만17세에 달하지 못한자는 유언을 하지 못한다" },
            { id: 8, article: "가정법원은 피성년후견인이 성년후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다", answer: "X", reason: "취소할수 없는 법률행위의 범위를 정할 수 있다" },
            { id: 9, article: "가정법원은 피한정후견인이 한정후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다", answer: "O", reason: "가정법원은 피한정후견인이 한정후견인의 동의를 받아야 하는 법률행위의 범위를 정할 수 있다(민법 제12조 제1항)." },
            { id: 10, article: "특정후견의 심판이 있은 후에 피특정후견인이 특정후견인의 동의없이 재산상의 법률 행위를 하더라도 이는 취소의 대상이 되지 않는다", answer: "O", reason: "특정후견은 행위능력을 제한하지 않으므로, 피특정후견인이 동의 없이 한 행위라도 행위능력 부족을 이유로 취소할 수 없다." },
            { id: 11, article: "피성년후견인 甲이 법정대리인 乙의 동의서를 위조하는 방법으로 乙의 동의가 있는 것 처럼 믿게 하여 자기 소유 건물을 丙에게 매각하는 계약을 체결하였다. 丙은 甲을 상대로 계약의 추인여부에 대한 확답을 촉구할 수 있다", answer: "X", reason: "상대방 丙이 촉구할 수 있는 대상: 피성년후견인 甲 (X) / 법정대리인 乙 (O)" },
            { id: 12, article: "제한능력자와 계약을 맺은 선의의 상대방은 추인이 있기 전까지 의사표시를 거절할 수 있다", answer: "X", reason: "거절은 계약상대자가 하는 것으로 상대방은 철회하여야 한다" },
            { id: 13, article: "피성년후견인 甲이 법정대리인 乙의 동의서를 위조하는 방법으로 乙의 동의가 있는 것 처럼 믿게 하여 자기 소유 건물을 丙에게 매각하는 계약을 체결하였다. 乙은 丙 상대로 계약을 취소할 수 있다", answer: "O", reason: "제한능력자의 속임수로 인한 취소권 배제(제17조)는 '능력자'로 믿게 한 경우에 적용되며, 동의서를 위조한 피성년후견인은 동의만으로 행위할 수 없으므로 취소권이 배제되지 않는다." },
            { id: 14, article: "법원이 선임한 재산관리인은 법원의 허가 없이 부재자의 재산에 대한 차임을 청구할 수 있다", answer: "O", reason: "차임 청구는 재산의 보존 및 이용·개량행위에 해당하므로 법원의 허가 없이도 재산관리인이 할 수 있다." },
            { id: 15, article: "부재자가 스스로 위임한 재산관리인에게 재산처분권까지 준 경우에도 그 재산관리인은 재산처분에 법원의 허가를 얻어야 한다", answer: "X", reason: "별도로 허가를 얻을 필요가 없다" },
            { id: 16, article: "후순위 상속인도 실종선고를 청구할 수 있는 이해관계인에 포함된다", answer: "X", reason: "후순위 상속인은 이해관계인인 아니다(실종선고를 청구할 수 있는 이해관계인에는 실종선고로 인해 직접적인 법률상 권리·의무의 변동을 받는 1순위 공동상속인, 선순위자의 상속포기로 직접 상속권을 얻은 후순위 상속인, 유증을 받은 자, 실종자의 채권자·채무자·보증인 및 배우자가 포함됩니다.)" },
            { id: 17, article: "실종선고를 받아 사망으로 간주된 자는 실종선고가 취소되지 않는 한 반증을 통해 그 효력을 번복할 수 없다", answer: "O", reason: "실종선고에 의한 사망추정이 아닌 사망간주의 효력은 실종선고 취소절차를 거치지 않는 한 단순한 반증만으로 번복되지 않는다." },
            { id: 18, article: "실종선고 취소의 청구를받은 가정법원은 공시최고의 절차를 거칠 필요가 없다", answer: "O", reason: "공시최고의 절차는 실종선고시에만 필요하다" },
            { id: 19, article: "2인 이상이 동일한 위난으로 사망한 경우엔느 동시에 사망한 것으로 본다", answer: "X", reason: "본다>추정한다" },
            { id: 20, article: "피상속인과 그의 직계비속 또는 형제자매가 동시에 사망한 것으로 추정되는 경우에도 대습상속이 인정된다", answer: "O", reason: "대습상속=대신상속, 아들의 자녀나 배우자" },
            { id: 21, article: "사단법인의 하부조직 중 하나라 하더라도 스스로 단체의 실체를 갖추고 독자활동을 한다면 독립된 법인 아닌 사단으로 볼 수 있다", answer: "O", reason: "법인의 하부조직이라도 독자적인 규약과 대표자를 두고 독립된 단체로서 활동하면 비법인사단으로 인정될 수 있다." },
            { id: 22, article: "법인은 법률의 규정에 좇아 정관으로 정한 목적의 범위내에서 권리와 의무를 주체가 된다는 민법 제34조는 정관이 있는 비법인사단에 유추적용할 수 있다", answer: "O", reason: "권리능력 없는 사단(비법인사단)도 대표자를 통해 목적 범위 내에서 권리·의무의 주체가 되므로 민법 제34조가 유추적용된다." },
            { id: 23, article: "대표권 없는 이사가 그 직무와 관련하여 타인에게 손해를 가한 경우, 법인의불법행위책임이 성립한다", answer: "X", reason: "대표권없는 이사에게 책임이 성립하지 않는 다. (사실상대표는 책임o)" },
            { id: 24, article: "법인의 책임이 성립하는 경우 특별한 사정이 없는 한 사원이 그 사항의 총회의결에 찬성했다는 사실만으로 법인과 연대책임이 부담하지는 않는다.", answer: "O", reason: "다만, 해당 사원의 행위가 찬성 의결을 넘어 독자적인 불법행위 요건(고의·과실, 위법성, 인과관계 등)을 직접 충족하는 등 특별한 사정이 있는 경우에만 예외적으로 사원 개인의 불법행위책임이 성립할 수 있습니다." },
            { id: 25, article: "비법인사단의 대표자가 외관상 객관적 직무에 관한 행위로 인정될 수 있으면 그의 행위가 직무에 관한것이 아님을 피해자가 중대한 사실로 알지 못 한 경우에도 비법인사단에게 손해배상책임을 물을 수 있다.", answer: "X", reason: "중대한 과실로 알지 못한 경우에는 책임을 물을 수 없다." },
            { id: 26, article: "재단법인의 정관변경은 그 변경방법을 정관에서 정한때에도 주무관청의 허가를 얻지 않으면 그 효력이 없다", answer: "O", reason: "재단법인의 정관변경은 정관에 변경방법이 규정되어 있더라도 주무관청의 허가를 얻지 않으면 효력이 없다(민법 제45조, 제46조)." },
            { id: 27, article: "이사의 변경등기는 대항요건이 아니라 효력발생요건이다.", answer: "X", reason: "효력발생요건이 아니라 대항요건이다. 효력발생요건 = \"우리 둘 사이에 권리가 생겼는가?\" (생성 여부) 대항요건 = \"생긴 권리를 남(제3자)한테도 주장할 수 있는가?\" (방어 여부)" },
            { id: 28, article: "사단법인의 사원의 지위를 양도 상속할 수 있다는 규약은 강행규정이 아니다", answer: "O", reason: "임의 규정이므로 정관으로 달리 정하는 것이 허용된다" },
            { id: 29, article: "사단법인의 사원의 지위는 양도 또는 상속할 수 없고 이는 정관으로 달리 정할 수 없다", answer: "X", reason: "임의 규정이므로 정관으로 달리 정하는 것이 허용된다" },
            { id: 30, article: "사단법인 이사의 대표권 제한은 등기되어 있지 않았다고 하더라고 정관에 그 기재가 있는 한 악의의 제3자에게 대항할 수 있다.", answer: "X", reason: "등기하지않으면 악의의 제3자에게 대항할 수 없다" },
            { id: 31, article: "이사의 대표권에 대한 제한은 등기하지 아니하면 제3자에게 대항하지 못하는 민법 제60조는 정ㅈ관에 있는 비법인사단에도 유추적용할 수 없다", answer: "O", reason: "비법인사단은 등기 능력이 없어 대표권 제한을 등기할 수 없으므로, 민법 제60조(등기하지 않은 대표권 제한의 대항 불가)는 유추적용되지 않는다." },
            { id: 32, article: "법인 사단은 대표권제한을 등기할 수 없으므로 거래상대방이 사원총회가 대표권 제한을 결의한 사실을 몰랐고 모른데 잘못이 없으면,제한을넘는 이사의 거래행위는 유효하다", answer: "O", reason: "비법인사단의 대표권 제한은 등기할 수 없으므로, 상대방이 선의·무과실인 경우 그 대표권 제한을 이유로 무효를 주장할 수 없어 거래행위는 유효하다." },
            { id: 33, article: "이사에 의해 선임된 대리인은 법인의 대표기관이 아니다", answer: "O", reason: "이사가 선임한 대리인은 특정 행위에 대한 대리인일 뿐 법인의 기관(대표기관)이 아니다." },
            { id: 34, article: "이사의 선임에 관한 민법 제63조는 비법인사단에 유추적용될 수 없다", answer: "X", reason: "63조는 임시이사선임에 관한 규정" },
            { id: 35, article: "특별대리인은 임시기관으로 법인의 대표기관이다", answer: "O", reason: "특별대리인은 법인과 이사의 이익이 상반하는 사항 등에 대해 법인을 대표하는 임시 대표기관이다(민법 제64조)." },
            { id: 36, article: "소집절차에 하자 있어 그 효력을 인정할 수 없는 종중총회의 결의라도 후에 적법하게 소집된 종중총회에서 이를 추인하면 처음부터 유효로 된다.", answer: "O", reason: "소집절차의 하자로 무효인 종중총회 결의라도 나중에 적법하게 소집된 종중총회에서 추인하면 소급하여 유효로 된다." },
            { id: 37, article: "이사회에서 어느 이사와의 관계사항을 의결하는 경우, 그 이사는 의사 정족 수 산정의 기초가 되는 이사의 수에 포함된다", answer: "O", reason: "특별이해관계가 있는 이사는 '의결권' 행사에는 배제되나, 전체 이사 수를 기준으로 하는 '의사정족수' 산정의 기초가 되는 이사 수에는 포함된다." },
            { id: 38, article: "권원 없이 타인의 토지에 심으 수목은 독립한 물권의 객체가 될 수 없다", answer: "O", reason: "정당한 권원 없이 타인의 토지에 심은 수목은 토지에 부합하므로 토지 소유자의 소유가 되며 독립한 물권의 객체가 되지 못한다." },
            { id: 39, article: "관리할 수 있는 자연력은 동산이다", answer: "O", reason: "민법 제98조에 따라 전기, 가스 등 관리할 수 있는 자연력은 동산으로 본다." },
            { id: 40, article: "종물은 주물소유자의 상용에 공여된 물건을 말한다", answer: "X", reason: "주물 소유자일필요는 없다" },
            { id: 41, article: "독립한 부동산은 종물이 될 수 없다", answer: "X", reason: "독립한 부동산도 종물이 될 수 있다" },
            { id: 42, article: "구분건물의 전유부분에 대한 가 압류 결정의 효력은 특별한 사정이 없는 한 그 대지권에 미치지 않는다.", answer: "X", reason: "대지권의 종된 권리성 및 일체성" },
            { id: 43, article: "부첩관계의 종료를 해제조건으로 하는 증여계약은 그 조건뿐만 아니라 그 계약자체도 무효이다", answer: "O", reason: "조건이 반사회질서의 법률행위(민법 제103조)에 해당하는 불법조건인 경우, 조건만 무효가 되는 것이 아니라 그 법률행위(계약) 전체가 무효" },
            { id: 44, article: "위증하기로 하는 계약은 당사자가 무효임을 알고 추인하여도 유효로 될 수 없다.", answer: "O", reason: "위증을 조건으로 한 계약은 반사회적 법률행위(제103조)로서 절대적 무효이므로, 당사자가 추인하더라도 유효로 될 수 없다." },
            { id: 45, article: "이중매매임을 알고 부동산을 매수한 것만으로 제2매매가 사회질서에 반하여 무효인 것은 아니다.", answer: "O", reason: "제2매수인이 알고 적극가담한 경우 무효/단순히 알고 매수한것만으로는 반사회질서 법률행위로서 무효가 되지 않는다" },
            { id: 46, article: "비자금은 소극적으로 은닉하기 위하여 임치한 것은 사회질서에 반하는 법률행위로 볼 수 없다", answer: "O", reason: "비자금을 형성한 행위 자체는 불법이더라도 이를 단순히 은닉하기 위해 임치(보관)한 행위까지 반사회적 법률행위로 볼 수 없다." },
            { id: 47, article: "강제집행을 면할 목적으로 부동산에 허위의 근저당권설정등기를 경료하는 행위는 민법 제103조의 선량한 풍속 기타 사회질서에 위반한 사항을  내용으로 하는 법률행위이다.", answer: "X", reason: "강제집행을 면할 목적으로 허위의 근저당권을 설정하는 행위는 통정허위표시(제108조)로서 무효일 뿐, 반사회적 법률행위(제103조)에는 해당하지 않는다." },
            { id: 48, article: "대리인에 의하여 행해진 법률행위에서 불공정한 법률행위가 문제되는 경우, 경솔이나 무경험은 대리인을 기준으로 판단한다.", answer: "O", reason: "대리인에 의한 법률행위 시 궁박은 '본인'을 기준으로 판단하고, 경솔과 무경험은 '대리인'을 기준으로 판단한다." },
            { id: 49, article: "대리인에 의한 법률행위가 불공정한 법률행위에 해당하는지 판단함에 있어서 궁박은 대리인을 기준으로 한다", answer: "X", reason: "궁박만 본인을 기준으로한다" },
            { id: 50, article: "경매목적물과 매각대금이 현저하게 공정을 잃은 경우에는 그 경매는 불공정한 법률행위에 해당하지 않는다", answer: "O", reason: "경매는 법률의 규정에 의한 국가기관의 처분이므로 민법 제104조(불공정한 법률행위)가 적용되지 않는다." },
            { id: 51, article: "매매계약이 약정된 매매대금의 과다로 인하여 불공정한 법률행위에 해당하는 경우 무효행위의 전환에 관한 민법 제138조가 적용될 수 없다.", answer: "X", reason: "민법 제 138조 , 무효인 법률행위라도 당사자가 그 무효를 알았더라면 '다른 법률행위'를 했을 것으로 인정될 때, 그 다른 법률행위로서의 효력을 인정해 주는 제도입니다." },
            { id: 52, article: "사실인 관습은 법령으로서의 효력이 없고, 법률행위 당사자의 의사를 보충함에 그친다.", answer: "O", reason: "사실인 관습은 법원(FA원)인 관습법과 달리 법적 규범력이 없으며, 당사자의 의사가 명확하지 않을 때 의사를 보충하는 수단에 그친다." },
            { id: 53, article: "통정허위표시에 의한 급부는 특별한 사정이 없는한 불법원인급여이다", answer: "X", reason: "통정허위표시 자체는 불법원인급여가 아닙니다" },
            { id: 54, article: "선의의 제3자에 대해서는 통정허위표시의 당사자 뿐만 아니라 그 누구도 통정허위표시의 무효로 대항할 수 없다", answer: "O", reason: "통정허위표시의 무효는 '선의의 제3자'에게 대항하지 못하며(제108조 제2항), 이는 당사자뿐만 아니라 누구나 그 선의의 제3자에 대해 무효를 주장할 수 없음을 의미한다." },
            { id: 55, article: "통정허위표시의 무효로 대항할 수 없는 제3자는 허위표시의 당사자와 그의 포괄승계인 이외의 자로서 허위표시행위를 기초로 하여 새로운 이해관계를 맺은 자를 말한다", answer: "O", reason: "통정허위표시의 무효로 대항할 수 없는 제3자란 당사자와 포괄승계인 이외의 자로서 허위표시에 의해 형성된 법률관계를 바탕으로 새로운 법률상 이해관계를 맺은 자를 말한다." },
            { id: 56, article: "통정허위표시에서 파산관재인은 제3자에 해당하지 않는다", answer: "X", reason: "파산관제인은 제3자에 해당한다. (참고: 파산관재인의 선의 악의는 파산관재인 개인 기준으로 하는것이 아니라 파산채권자 전체를 기준으로 판단한다. 단 한명이라도 선의라면 파산관재인은 선의의제3자로 보호받는다" },
            { id: 57, article: "가장의 채권양도 후 채무가 변제되지 않고 있는 동안 채권양도가 허위임이 밝혀진 경우에 있어서는 채무자는 통정허위표시에 의하여 외형상 형성된 법률관계를 기초로 하여 새로운 법률상 이해관계를 맺은 제3자에 해당하지 않는다.", answer: "O", reason: "원래부터 빚을 지고 있던 채무자는 가짜 채권양도가 일어났다고 해서 새로 거래를 한 사람이 아니므로, 보호받는 제3자가 아니다" },
            { id: 58, article: "상대방이 표의자의 진의에 동의한 경우 표의자는착오를 이유로 의사표시를 취소할 수 없다.", answer: "O", reason: "표의자의 진의에 상대방이 동의하여 오봉무해의 원칙에 따라 당사자가 원한 대로 계약이 성립된 경우 착오취소는 허용되지 않는다." },
            { id: 59, article: "계약 당시를 기준으로 하여 장래의 미필적 사실의 발생에 대한 기대나 예상이 빗나간 경우, 착오취소는 인정되지 않는다.", answer: "O", reason: "착오는 계약 성립 당시 존재하는 객관적 사실에 대해 실제와 다르게 잘못 인식한 경우여야 합니다. 단순한 '장래에 대한 예측이나 기대'가 어긋난 것은 착오의 범주에 들어가지 않으며, 주로 단순한 '동기의 착오'나 '주관적 사정'에 불과합니다." },
            { id: 60, article: "채무자의 동일성에 관한 물상보증인의 착오는 법률행위 내용의 중요부분에 관한 착오에 해당하지 않는다.", answer: "X", reason: "대법원 판례에 따르면, 채무자의 동일성에 관한 물상보증인의 착오는 법률행위 내용의 중요부분에 관한 착오에 해당하여 취소할 수 있습니다 (대법원 1995. 12. 22. 선고 95다37494 판결)." },
            { id: 61, article: "매매계약에서 매수인이 목절물의 시가에 관해 착오를 하였더라도 이는 원칙적으로 중요부분의 착오에 해당하지 않는다.", answer: "O", reason: "부동산의 시가(가격)에 관한 착오는 특별한 사정이 없는 한 법률행위 내용의 중요부분에 관한 착오로 보지 않습니다(판례)." },
            { id: 62, article: "착오로 인하여 표의자가 경제적인 불이익을 입지 않았다면, 법률행위 내용의 중요부분의 착오라고 할 수 없다.", answer: "O", reason: "착오로 인해 표의자에게 아무런 경제적 불이익이 발생하지 않은 경우, 중요부분의 착오라고 볼 수 없어 취소할 수 없습니다(판례)." },
            { id: 63, article: "착오로 인한 의사표시에서 착오가 법률행위 내용의 중요부분에 관한 것이라는 점과 중대한 과실이 없었다는 점은 표의자가 증명하여야 한다.", answer: "X", reason: "착오가 중요부분에 해당한다는 점은 표의자(취소하려는 자)가 증명하여야 하지만, 표의자에게 '중대한 과실'이 있었다는 점은 상대방(취소를 저지하려는 자)이 증명하여야 합니다." },
            { id: 64, article: "매도인이 매매계약을 적법하게 해제한 후에도 매수인은 그 매매계약을 착오로 취소할 수 있다.", answer: "O", reason: "매도인이 매수인의 채무불이행을 이유로 계약을 적법하게 해제한 후라도, 매수인은 해제로 인한 손해배상책임을 면하기 위해 착오를 이유로 취소권을 행사하여 계약 전체를 무효로 만들 수 있습니다(판례)." },
            { id: 65, article: "매도인의 하자담보책임이 성립하더라도 착오를 이유로 한 매수인의 취소권은 배제되지 않는다", answer: "O", reason: "매도인의 하자담보책임이 성립하더라도 매수인의 착오 취소권은 경합하여 인정되므로, 매수인은 착오를 이유로 매매계약을 취소할 수 있습니다(판례)." },
            { id: 66, article: "부작위에 의한 기망행위로도 사기에 의한 의사표시가 성립할 수 있다.", answer: "O", reason: "상대방에게 고지의무가 있는 사항에 대해 침묵(부작위)하는 경우에도 불법적인 기망행위가 성립하여 사기에 의한 의사표시가 될 수 있습니다." },
            { id: 67, article: "교환계약의 당사자가 자기소유 목절물의 시가를 묵비하였다면 특별한 사정이 없는 한 기망행위가 성립한다", answer: "X", reason: "교환계약에서 당사자 일방이 자기가 소유하는 목적물의 시가를 묵비하거나 시가보다 높은 가액을 시가라고 고지하였더라도, 관행상 허용되는 상술에 불과하여 기망행위에 해당하지 않습니다(판례)." },
            { id: 68, article: "甲은 乙의 기망으로 그 소유의 x토지를 丙에게 팔았고, 丙은 그의 채권자 丁에게 x토지에 근저당을 설정하였다. 甲은 기망행위를 이유로 매매계약을 취소하려고 한다. 甲은 丙이 그의 잘못없이 기망사실을 몰랐을때에만 매매계약을 취소할 수 있다.", answer: "X", reason: "제3자의 사기의 경우 취소하기 위해서는 상대방이 악의이거나 과실이 있을때 가능" },
            { id: 69, article: "제3자에 의한 사기행위로 계약을 체결한 경우, 표의자는 먼저 그 계약을 취소하여야 제3자에 대하여 불법행위로 인한 손해배상 청구할 수 있다.", answer: "X", reason: "제3자의 사기로 계약을 체결한 경우, 그 계약을 취소하지 않고서도 제3자에 대하여 직접 불법행위로 인한 손해배상을 청구할 수 있습니다(대법원 판례)." },
            { id: 70, article: "재단법인 설립행위의 효력발생을 위해서는 의사표시의 도달이 요구되지 않는다.", answer: "O", reason: "재단법인의 설립행위는 상대방 없는 단독행위이므로 의사표시의 도달이 요구되지 않고 행위가 완료되면 바로 효력이 발생합니다." },
            { id: 71, article: "상대방이 현실적으로 통지를 수령하거나 그 내용을 안때에 도달한 것으로 본다.", answer: "X", reason: "도달주의에서 '도달'이란 상대방이 현실적으로 통지를 수령하거나 안 것을 의미하는 것이 아니라, 상대방의 지배권 내에 들어가 객관적으로 알 수 있는 상태에 이른 것을 의미합니다." },
            { id: 72, article: "도달주의 원칙을 정하는 민법제 111조는 임의규정이므로 당사자는 약정으로 의사표시의 효력발생시기를 정할 수 있다.", answer: "O", reason: "민법 제111조의 도달주의 규정은 임의규정이므로 당사자 간의 약정으로 의사표시의 효력발생 시기를 달리 정할 수 있습니다." },
            { id: 73, article: "제한능력자는 원칙적으로 의사표시의 수령무능력자이다.", answer: "O", reason: "제한능력자(미성년자, 피성년후견인, 피한정후견인)는 의사표시의 수령무능력자로서 그에 대한 의사표시의 도달을 대항할 수 없습니다(민법 제112조)." },
            { id: 74, article: "미성년자는 그 행위능력이 제한되고 있는 범위에서 수령 무능력자이다.", answer: "O", reason: "미성년자는 독자적으로 법률행위를 할 수 있는 범위를 제외하고는 원칙적으로 수령무능력자에 해당합니다." },
            { id: 75, article: "표의자가 과실로 상대방을 알지 못하는 경우에는 민사소송법 공시송달 규정에 의하여 의사표시의 효력을 발생시킬 수 있다.", answer: "X", reason: "과실 없이 상대방을 알지 못하거나 상대방의 소재를 알지 못하는 경우에만 공시송달을 할 수 있으며, '과실로' 알지 못한 경우에는 공시송달을 이용할 수 없습니다(민법 제113조)." },
            { id: 76, article: "대리인이 대리권범위안에서 현명하게 상대방과 통정허위표시를 한 경우, 본인이 선의라면 특별한 사정이 없는 한 그는 허위표시의 유효를 주장할 수 있다.", answer: "X", reason: "대리행위의 하자 유무는 대리인을 기준으로 판단하므로(민법 제116조 제1항), 대리인이 통정허위표시를 한 경우 본인의 선의 여부와 관계없이 무효가 됩니다." },
            { id: 77, article: "대리인에 의한 법률행위에서 착오는 유무는 대리인을 표준으로 판단한다.", answer: "O", reason: "대리인에 의한 법률행위에서 의사표시의 하자(착오, 사기, 강박 등) 유무는 대리인을 기준으로 판단합니다(민법 제116조 제1항)." },
            { id: 78, article: "대리인의 법률행위 효과는 본인에게 귀속되므로 의사표시의 하자의 유무는 본인을 기준으로 판단한다", answer: "X", reason: "의사표시의 하자의 유무는 본인이 아니라 대리인을 기준으로 판단합니다(민법 제116조 제1항)." },
            { id: 79, article: "본인의 묵시적 승낙에 기초한 임의대리인의 복임권 행사는 허용되지 않는다.", answer: "X", reason: "본인의 묵시적 승낙에 기초한 임의대리인의 복임권 행사도 유효하게 허용됩니다." },
            { id: 80, article: "임의대리인이 본인의 승낙을 얻어 복대리인을 선임한 경우, 본인에 대하여 그 선임감독에 관한 책임이 없다.", answer: "X", reason: "임의대리인이 본인의 승낙이나 부득이한 사유로 복대리인을 선임한 때에는 본인에 대하여 그 선임감독에 관한 책임이 있습니다(민법 제121조 제1항)." },
            { id: 81, article: "법정대리인이 부득이한 사유로 복대리인을 선임한 경우, 그 선임감독에 대한 책임만이 있다.", answer: "O", reason: "법정대리인이 부득이한 사유로 복대리인을 선임한 경우에는 본인에 대하여 선임·감독상의 책임만을 집니다(민법 제122조 단서)." },
            { id: 82, article: "대리인이 복대리인을 선임한  후 사망하더라도 특별한 사정이 없는 한 그 복대리권은 소멸하지 않는다", answer: "X", reason: "복대리권은 대리권의 존재를 전제로 하므로, 대리인이 사망하여 대리권이 소멸하면 복대리권도 당연히 소멸합니다." },
            { id: 83, article: "복대리인이 선임한 대리인은 모두 법정대리인이다", answer: "X", reason: "복대리인은 대리인이 선임한 '본인의 대리인'이며, 대리인이 선임하였더라도 항상 임의대리인입니다." },
            { id: 84, article: "복대리인의 대리행위에 대해서는 표현대리가 성립할 수 없다", answer: "X", reason: "복대리인의 대리행위에 대해서도 민법 제125조, 제126조, 제129조의 표현대리가 적용되어 성립할 수 있습니다." },
            { id: 85, article: "상대방의 유권대리 주장에는 표현대리의 성립 역시 포함되므로 법원은 표현대리의 성립여부까지 판단해야한다.", answer: "X", reason: "유권대리의 주장 속에 표현대리의 주장이 당연히 포함되는 것은 아니므로, 법원이 표현대리의 성립 여부를 판단하지 않아도 변론주의 위반이 아닙니다(판례)." },
            { id: 86, article: "표현대리를 주장할때에는 무권대리인과 표현대리에 해당하는 무권대리 행위를 특정하여 주장하여야 한다.", answer: "O", reason: "표현대리를 주장할 때에는 무권대리인과 해당 표현대리 행위를 특정하여 주장하여야 합니다." },
            { id: 87, article: "표현대리가 성립하는 경우, 상대방에게 과실이 있으면 과실상계의 법리가 적용된다.", answer: "X", reason: "표현대리가 성립하여 본인이 책임을 지는 경우 상대방에게 과실이 있더라도 과실상계의 법리를 적용하여 본인의 책임을 감경할 수 없습니다(대법원 판례)." },
            { id: 88, article: "대리권 소멸 후의 표현대리가 인정되는 경우, 그표현대리의 권한을 넘은 대리행위가 있을때 권한을 넘은 표현대리가 성립할 수 있다.", answer: "O", reason: "대리권 소멸 후의 표현대리(제129조)가 인정되는 경우에도 그 권한을 넘은 대리행위가 있을 때에는 권한을 넘은 표현대리(제126조)가 성립할 수 있습니다." },
            { id: 89, article: "정당한 이유의 유무는 대리행위 당시와 그 이후 사정을 고려하여 판단한다.", answer: "X", reason: "오직 대리행위에 대해서만 판단한다." },
            { id: 90, article: "대리행위가 대리권을 제한하는 강행규정을 위반하여 권한을 넘은 경우에는 표현대리가 인정되지 않는다.", answer: "O", reason: "강행법규 위반으로 무효인 법률행위에 대해서는 표현대리 법리가 적용될 수 없습니다." },
            { id: 91, article: "권한을 넘은 표현대리의 규정은 법정대리에는 적용되지 않는다.", answer: "X", reason: "민법 제126조 권한을 넘은 표현대리 규정은 임의대리뿐만 아니라 법정대리에도 적용됩니다." },
            { id: 92, article: "본인의 성년후견의 개시는 대리권의 소멸사유가 아니다.", answer: "O", reason: "대리인의 성년후견 개시는 대리권 소멸사유이지만(민법 제127조 제2호), 본인의 성년후견 개시는 대리권 소멸사유가 아닙니다." },
            { id: 93, article: "행위능력자인 임의대리인이 성년후견개시 심판을 받아 제한능력자가 되면 그의 대리권은 소멸한다", answer: "O", reason: "임의대리인이 성년후견개시의 심판을 받으면 대리권이 소멸합니다(민법 제127조 제2호)." },
            { id: 94, article: "본인이 대리권의 수여표시에 의한 표현대리 또는 대리권 소멸후의 표현대리로 인하여 책임을 지기 위해서는 상대방이 선의 무과실이어야 한다.", answer: "O", reason: "대리권 수여표시에 의한 표현대리(제125조) 및 대리권 소멸 후의 표현대리(제129조)에서 본인이 책임을 지기 위해서는 상대방이 선의·무과실이어야 합니다." },
            { id: 95, article: "대리인이 자신의 이익을 도모하기 위하여 대리권을 남용한 경우는 무권대리에 해당한다.", answer: "X", reason: "대리권 남용은 원칙적으로 유효(대리권 범위 내의 행위)하며, 상대방이 알았거나 알 수 있었을 때(민법 제107조 제1항 단서 유추적용) 무효가 되는 것이지 무권대리가 되는 것은 아닙니다." },
            { id: 96, article: "무권대리인이 무권대리행위 후 본인을 단독상속한 경우, 그 무권대리행위가 무효임을 주장하는 것은 신의칙에 반하지 않는다.", answer: "X", reason: "무권대리인이 본인을 단독상속한 후 자신이 한 무권대리행위의 무효를 주장하는 것은 금반언 및 신의칙에 반하여 허용되지 않습니다." },
            { id: 97, article: "상대방이 계약 당시 대리인의 대리권 없음을 알았다면, 상대방은 상당한 기간을 정하여 본인에게 추인여부를 확답을 최고할 수 없다.", answer: "X", reason: "상대방이 악의(대리권 없음을 안 경우)이더라도 본인에 대하여 상당한 기간을 정하여 추인 여부의 확답을 최고할 수 있습니다(민법 제131조)." },
            { id: 98, article: "무권대리행위에 대한 본인의 추인은 그 일부에 대하여 추인을 하거나 그 내용을 변경하여 추인하였을 경우에는 상대방의 동의를 얻지 못하는 한 무효이다.", answer: "O", reason: "추인은 의사표시의 전부에 대하여 하여야 하고, 일부분에 대하여 추인을 하거나 내용을 변경하여 추인하였을 때에는 상대방의 동의를 얻지 못하는 한 무효이다." },
            { id: 99, article: "본인이 무권대래행위의 추인을 거절한 후에는 다시 추인할 수 없다", answer: "O", reason: "확정적 무효가 된다." },
            { id: 100, article: "본인이 무권대리인에게 추인한 때에도 그 사실을 모르는 상대방은 매매계약을 철회할 수 있다.", answer: "O", reason: "본인이 무권대리인에게 추인한 경우 그 사실을 알지 못한 상대방은 추인의 효과를 주장할 수 없고, 상대방은 계약을 철회할 수 있다(민법 제134조, 제132조)." },
            { id: 101, article: "상대방에 대한 무권대리인의 책임에 관한 규정에 의하여 무권대리인은 상대방에게 무과실 책임을 진다.", answer: "O", reason: "상대방에 대한 무권대리인의 책임(민법 제135조)은 법정무과실책임이므로 무권대리인은 자신에게 과실이 없더라도 책임을 진다." },
            { id: 102, article: "무권대리인의 상대방에 대한 책임은 대리권의 흠결에 관하여 대리인에게 귀책사유가 있는 경우에만 인정된다.", answer: "X", reason: "무권대리인은 상대방에 대한 무과실책임이므로 귀착사유 우무 상관없이 인정된다" },
            { id: 103, article: "토지거래허가구역 내의 토지를 매매한 당사자가 계약체결시부터 허가를 잠탈할 의도였더라도, 그 후 해당토지에 대한 허가 구역 지정이 해제되었다면 위매매계약은 유효가 된다.", answer: "X", reason: "확정적 무효가된다" },
            { id: 104, article: "무효인 법률행위 따른 법률효괄르 침해하는 것처럼 보이는 채무불이행이 있다고 하여도 그 법률효과의 침해에 따른 손해배상을 청구할 수는 없다.", answer: "O", reason: "채무자체가 없다" },
            { id: 105, article: "집합채권의 양도가 양도금지특약을 위반하여 무효인경우, 채무자는 집합채권의 일부 개별 채권을 특정하여 추인할 수 없다.", answer: "X", reason: "무효인 집합채권> 일부만 쏙 골라서 추인할 수 있다" },
            { id: 106, article: "제한능력자가 맺은 계약은 추인이 있을때까지 상대방이 그 의사표시를 취소할 수 있다.", answer: "X", reason: "추인 전까지 제한능력자와 계약을 맺은 상대방이 할 수 있는 의사표시는 ‘취소’가 아니라 ‘철회’입니다" },
            { id: 107, article: "무효인 법률행위는 취소할 수 없다", answer: "X", reason: "무효인 법률행위도 취소의 원인이 있는 경우(예: 제한능력자의 무효행위) 취소할 수 있다(무효와 취소의 이중효)." },
            { id: 108, article: "계약의 자유의 원칙상 제한능력자를 보호하는 규정에 반하는 매매계약도 유효하다", answer: "X", reason: "제한능력자 보호규정은 강행규정이므로 이에 반하는 약정은 무효이다." },
            { id: 109, article: "취소권의 행사시 반드시 취소원인의 진술이 함꼐 행해져야 하는 것은 아니다", answer: "O", reason: "취소의 의사표시는 명시적·묵시적으로 할 수 있으며, 반드시 취소원인을 밝혀야 하는 것은 아니다." },
            { id: 110, article: "취소할 수 있는 법률행위는 취소권자가 추인할 수 있고, 추인 후에는 취소할 수 없다.", answer: "O", reason: "취소할 수 있는 법률행위는 취소권자가 추인할 수 있고, 추인한 후에는 더 이상 취소하지 못한다(민법 제143조 제1항)." },
            { id: 111, article: "법률행위를 취소한 후라도 무효행위의 추인의 요건과 효력으로서 추인할 수 있다.", answer: "O", reason: "취소된 법률행위는 처음부터 무효인 것으로 보므로, 취소 후라도 무효행위 추인의 요건과 효력에 따라 추인할 수 있다." },
            { id: 112, article: "취소할 수 있는 법률행위의 추인은 취소의 원인이 소멸된 후에 하여야 효력이 있다.", answer: "O", reason: "취소할 수 있는 법률행위의 추인은 취소의 원인이 소멸된 후에 하여야 효력이 있다(민법 제144조 제1항)." },
            { id: 113, article: "피성년후견인은 법정대리인의 동의가 있더라도 재산상 법률행위를 스스로 유효하게 추인할 수 없다.", answer: "O", reason: "피성년 후견인은 동의권 자체가 없음으로 동의 얻어서 해야한다. 스스로 유효하게 추인하는 것은 불가능하다." },
            { id: 114, article: "취소권의 단기체적기간은 취소할 수 있는 날로부터 3년이다.", answer: "X", reason: "취소권은 추인할 수 있는 날로부터 3년, 법률행위를 한 날로부터 10년 내에 행사하여야 한다(민법 제146조)." },
            { id: 115, article: "단독행위의 경우 상대방이 동의한 경우에도 조건을 붙일 수 없다.", answer: "X", reason: "단독행위에는 원칙적으로 조건을 붙일 수 없으나, 상대방의 동의가 있거나 상대방에게 이익만을 주는 경우에는 조건을 붙일 수 있다." },
            { id: 116, article: "조건은 법률행위의 효력의 발생 또는 소멸의 장래의 불확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다.", answer: "O", reason: "조건이란 법률행위 효력의 발생 또는 소멸을 장래의 불확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다." },
            { id: 117, article: "조건은 법률행위의 효력의 발생 또는 소멸의 장래의 확실한 사실의 성부에 의존하게 하는 법률행위의 부관이다", answer: "X", reason: "장래의 '확실한' 사실의 성부에 의존하게 하는 법률행위의 부관은 조건이 아니라 '기한'이다." },
            { id: 118, article: "법정조건도 법률행위의 부관으로서 조건에 해당한다.", answer: "X", reason: "조건은 당사자가 임의로 부가한 부관이어야 하므로, 법률에 의해 요구되는 법정조건은 법률행위의 부관으로서의 조건이 아니다." },
            { id: 119, article: "부관이 붙은 법률행위에 있어서 부관으로 표시된 사실의 발생 유무에 상관없이 그 채무를 이행해야 하는 경우에는 조건으로 보아야한다.", answer: "X", reason: "기한에 관한 이야기이다." },
            { id: 120, article: "당사자는 조건의 성부가 미정이 동안에 조건의 성취로 인하여 생길 상대방의 이익을 해하지 못한다.", answer: "O", reason: "조건있는 법률행위의 당사자는 조건의 성부가 미정한 동안에 조건의 성취로 인하여 생길 상대방의 이익을 해하지 못한다(민법 제148조)." },
            { id: 121, article: "조건의 성취를 의제하는 효과를 발생시키는 조건성취 방해 행위에는 과실에 의한 행위도 포함된다.", answer: "O", reason: "조건성취 방해행위는 신의성실에 반하는 행위로서 고의뿐만 아니라 과실에 의한 행위도 포함된다." },
            { id: 122, article: "불능, 해재는 - 기성 정지는 +이며, 곱해서 +는 조건없는 법률행위이고 -는 무효가 된다", answer: "O", reason: "불능조건이 정지조건이면 무효(-), 불능조건이 해제조건이면 조건없는 법률행위(+)이며, 기성조건이 정지조건이면 조건없는 법률행위(+), 기성조건이 해제조건이면 무효(-)이다." },
            { id: 123, article: "기한이익 상실의 약정은 특별한 사정이 없으면 형성권적 기한이익 상실의 약정으로 추정한다", answer: "O", reason: "기한이익 상실의 특약은 특별한 사정이 없는 한 채권자를 위한 '형성권적 기한이익 상실의 특약'으로 추정한다." },
            { id: 124, article: "형성권적 기한이익 상실의 특약이 있는 할부채무의 경우, 특별한 사정이 없는 한 1회의 불이행이 있으면 채무전액에 대하여 소멸시효가 진행한다.", answer: "X", reason: "형성권적 기한이익 상실 특약이 있는 경우, 채권자가 이행청구 등 기한이익 상실 의사표시를 한 때부터 채무 전액에 대해 소멸시효가 진행한다." },
            { id: 125, article: "정지조건부기한이익 상실의 특약이 있는 경우, 그 특약에 정한 기한이익 상실사유 발생하더라도 기한이익을 상실케 하는 채권자의 의사표시가 없다면 특별한 사정이 없는 한 이행기 도래의 효과가 발생하지 않는다.", answer: "X", reason: "정지조건부 기한이익 상실 특약의 경우, 특약에서 정한 사유가 발생하면 채권자의 특별한 의사표시가 없어도 당연히 기한이익을 상실하고 이행기가 도래한다." },
            { id: 126, article: "기간을 월로 정한경우 그 기간이 오전 영시로부터 시작하는 대에는 기간의 초일을 산입한다.", answer: "O", reason: "기간의 초일이 오전 0시부터 시작하는 때에는 초일을 산입한다(민법 제157조 단서)." },
            { id: 127, article: "제척기간의 경과는 법원의 직권조사사항이지만, 소멸시효의 오나성은 직권조사사항이 아니다.", answer: "O", reason: "제척기간의 경과 여부는 법원의 직권조사사항이나, 소멸시효의 완성은 당사자의 주장이 필요한 변론주의 대상이다." },
            { id: 128, article: "손해배상청구권에대해 법률이 제척기간을 규정하고 있더라도 그 청구권은 소멸시효에 걸린다.", answer: "O", reason: "제척기간 규정이 있더라도 해당 권리가 채권인 이상 소멸시효의 대상도 된다." },
            { id: 129, article: "소유권에 기한 말소등기청구권은 소멸시효의 적용을 받지 않는다.", answer: "O", reason: "소유권에 기한 물권적 청구권(말소등기청구권 등)은 소유권과 분리되어 독립하여 소멸시효에 걸리지 않는다." },
            { id: 130, article: "공유관계가 존속하는 공유물 분할청구권말이 독립하여 시효로 소멸될 수 없다.", answer: "O", reason: "공유관계가 존속하는 한 공유물분할청구권은 공유관계와 독립하여 따로 소멸시효에 걸리지 않는다." },
            { id: 131, article: "당사자가 본래의 소멸시효 기산일보다 뒤의 날짜를 기산일로 주장하는 경우 법원은 본래의 소멸시효 기산일을 기준으로 소멸시효를 계산해야한다.", answer: "X", reason: "소멸시효의 기산일은 법률효과의 발생에 영향을 미치는 것이므로 변론주의가 적용되어 당사자가 주장하는 기산일을 기준으로 하여야 한다." },
            { id: 132, article: "채무불이행으로 인한 손해배상청구권의 소멸시효는 손해배상을 청구한 때부터 진행한다.", answer: "X", reason: "채무불이행시부터 진행한다" },
            { id: 133, article: "불확정기한부 채권은 채권자의 이행최고가 있은 날로부터 소멸시효가 진행한다.", answer: "O", reason: "불확정기한부 채권의 소멸시효는 기한이 도래한 때(객관적으로 기한이 도래한 때)부터 진행한다." },
            { id: 134, article: "이행기간을 정하지 않은 채권은 채권자의 이행최고가 있은 날로부터 소멸시효가 진행한다.", answer: "X", reason: "언제나 행사가 가능하므로 채권성립시부터 진행한다." },
            { id: 135, article: "동시이의 항변권이 붙어있는 채권은 그 항변권이 소멸된 이후부터 소멸시효가 진행된다.", answer: "X", reason: "이행기 도래시부터 소멸시효가 진행된다" },
            { id: 136, article: "재산권이전청구권과 동시이행관계에 있는 매매대금채권의 소멸시효는 지급기일부터 진행한다.", answer: "O", reason: "동시이행관계에 있는 채권이라 하더라도 그 채권의 지급기일(이행기)부터 소멸시효가 진행한다." },
            { id: 137, article: "무권대리인에 대한 상대방의 계약이행청구권이나 손해배상청구권은 그 선택권을 행사 할 수 있을때부터 소멸시효가 진행한다.", answer: "O", reason: "무권대리인에 대한 상대방의 계약이행청구권 또는 손해배상청구권의 소멸시효는 상대방이 선택권을 행사할 수 있는 때부터 진행한다." },
            { id: 138, article: "인도받은 부동산을 소유권이전등기하지 않고 제3자에게 처분 인도한 매수인의 등기청구권은 소멸시효에 걸리지 않는다.", answer: "O", reason: "적극적권리행사로 보아 소멸시효에 걸리지 않는다" },
            { id: 139, article: "매수인이 매매 목적물인 부동산을 인도받아 점유하고 있는 이상 만약 제3자가 미등기매수인의 점유를 침탈했더라도 미등기 매수인의 매도인에 대한 매매를 원인으로 하는 소유권이전 등기 청구권은 소멸시효가 진행하지 않는다.", answer: "X", reason: "미등기 매수인이 인도받아 점유하다가 제3자에게 점유를 승계해 준 경우 등기청구권의 소멸시효는 진행하지 않으나, 제3자가 점유를 '침탈'하여 점유를 상실한 경우에는 점유상실 시점부터 소멸시효가 진행한다." },
            { id: 140, article: "등기없는 점유취득시효가 완성하였으나 등기하지 않는 토지점유자가 토지의 점유를 잃은 경우, 그로부터 10년이 지나면 등기청구권은 소멸한다.", answer: "O", reason: "점유취득시효 완성 후 점유를 상실한 경우, 그 등기청구권은 점유를 상실한 때로부터 10년이 경과하면 소멸시효가 완성한다." },
            { id: 141, article: "소멸시효에 의한 권리소멸은 기산일에 소급하여 효력이 있으나, 제척기간에 의한 권리소멸은 장래에 향하여 효력이 있다.", answer: "O", reason: "소멸시효 완성의 효력은 권리의 기산일에 소급하여 효력이 생기나(민법 제167조), 제척기간 경과로 인한 권리소멸은 소급효가 없어 장래에 향하여 효력이 생긴다." },
            { id: 142, article: "동일한 목적을 달성하기 위하여 복수의 채권을 가진 채권자가 어느 하나의 채권만을 행사하는 것이 명백한 경우, 채무자의 소멸시효 완성 항변은 채권자가 행사하는 당해 채권에 대한 항변으로 볼 수 있다.", answer: "O", reason: "동일한 목적을 달성하기 위한 복수의 채권 중 채권자가 어느 하나만을 행사하는 것이 명백한 경우, 채무자의 소멸시효 완성 항변은 채권자가 실제로 행사하는 당해 채권에 대한 항변으로 본다." },
            { id: 143, article: "물상보증인은 피담보채권의 소멸에 의하여 직접 이익을 받는 관계에 있으므로 피담보채권의 소멸시효의 완성을 주장할 수 있다.", answer: "O", reason: "물상보증인은 피담보채권의 소멸에 따라 직접 담보책임을 면하는 이익을 받는 자이므로 피담보채권의 소멸시효 완성을 독자적으로 주장할 수 있다." },
            { id: 144, article: "유치권이 성립된 부동산의 매수인은 피담보채권의 소멸시효를 완성으로 직접이익을 받는자에 해당하지 않으므로 소멸시효의 완성을 원용할 수 없다.", answer: "X", reason: "직접 이익을 받는자이므로 소멸시효의 완성을 주장할 수 있다" },
            { id: 145, article: "甲의 乙에 대한 채권을 담보하기 위해 저당권이 설정된 경우, 그 후순위 저당권자는 甲의 乙에 대한 채권의 소멸시효 완성을 독자적으로 원용할 수 있는 자이다.", answer: "X", reason: "후순위 저당권자는 선순위 저당권의 피담보채권이 소멸하면 순위가 상승하는 간접적 이익을 얻을 뿐이므로, 선순위 저당채권의 소멸시효 완성을 독자적으로 원용할 수 있는 직접 이해관계인에 해당하지 않는다." },
            { id: 146, article: "甲의 乙에 대한 채권을 담보하기 위해 저당권을 설정된 경우, 乙의 일반채권자는 甲의 乙에 대한 채권의 소멸시효 완성을 독자적으로 원용할 수 있는 자이다.", answer: "X", reason: "채무자의 일반채권자는 채권자대위권에 의해 시효완성을 대위주장할 수 있을 뿐이며, 자신의 이름으로 독자적으로 소멸시효 완성을 원용할 수 있는 자는 아니다." },
            { id: 147, article: "시효이익을 이익을 이미 포기한 사람과의 법률관계를 통해시효이익을 원용할 이해관계를 형성한 사람은 소멸시효를 주장할 수 있다", answer: "X", reason: "시효가 완성되어 빚이 사라지면 직접 이득을 보는 사람만 시효완성을 주장할 수 있다." },
            { id: 148, article: "소멸시효의 중단사유로서의승인은 소멸시효의 진행이 개시된 이후에만 가능하다.", answer: "O", reason: "소멸시효 중단사유로서의 승인(민법 제168조 제3호)은 소멸시효의 진행이 개시된 이후 시효가 완성되기 전에 하여야 효력이 있다." },
            { id: 149, article: "채무자가 변제기 도래 후에 한 채무의 승인은 채권의 소멸시효 중단사유이다.", answer: "O", reason: "채무자가 변제기 도래 후 채무를 승인하는 것은 소멸시효 진행을 중단시키는 적법한 승인에 해당한다." },
            { id: 150, article: "비법인사단의 대표자가 총회결의에 따라 총유물을 매도하여 소유권이전등기를 해주기위해 매수인과 함께 법무사 사무실을 방문한 행위는 , 소유권이전등기청구권의 소멸시효 중단의 효력이 있는 승인에 해당한다.", answer: "O", reason: "비법인사단의 대표자가 총유물 매매에 따른 등기의무 이행을 위해 매수인과 함께 법무사 사무실을 방문한 행위는 채무 존재를 인정하는 묵시적 승인으로서 소멸시효 중단의 효력이 있다." },
            { id: 151, article: "소멸시효를 주장하는 자가 제기한 소에 권리자가 응소하여 적극적으로 권리를 주장하고 그것이 받아들여진 경우, 응소한때에 소멸시효가 중단된다.", answer: "O", reason: "시효완성을 주장하는 자가 제기한 소송에서 권리자가 피고로 응소하여 적극적으로 권리를 주장하고 이것이 받아들여진 경우 재판상 청구로서 소멸시효 중단효가 발생하며, 중단시점은 응소 시이다." },
            { id: 152, article: "채무자가 제기한 채무부존재 확인소송에서 채권자가 피고로서 응소하여 적극적으로 권리를 주장하고 그것이 법원에 의해 받아들여진 경우, 채권의 소멸시효가 중단된다.", answer: "O", reason: "채무자가 제기한 채무부존재확인의 소에서 채권자가 피고로서 응소하여 적극적으로 권리를 주장하고 인정된 경우 재판상 청구로서 소멸시효가 중단된다." },
            { id: 153, article: "물상보증인의 저당권말소등기청구의 소에 대한 채권자의 응소는 소멸시효 중단사유가 아니다.", answer: "O", reason: "물상보증인이 제기한 저당권말소등기청구소송에서 채권자가 응소하여 피담보채권의 존재 및 유효를 주장하는 것은 피담보채권에 대한 재판상 청구로서 시효중단효가 인정된다." },
            { id: 154, article: "소멸시효 중단사유로서의 채무승인은 채무가 있음을 알고 있다는 뜻의 의사표시이므로 효과의사가 필요하다", answer: "X", reason: "관념의통지(사실의알림)이면 충분하다." },
            { id: 155, article: "재판상 청구로 인하여 중단된 시효는 재판이 시작된때부터 새로 진행된다", answer: "X", reason: "재판이 확정된때부터 진행된다" },
            { id: 156, article: "소멸시효의 정지에 관해서는 민법에 명문의 규정이 있으나, 제척기간의 정지에 관해서는 민법에 명문의 규정이 없다", answer: "O", reason: "민법은 소멸시효의 정지에 대해서는 명문 규정(제179조~제182조)을 두고 있으나, 제척기간의 정지에 대해서는 명문 규정을 두고 있지 않다." },
            { id: 157, article: "소멸시효의 이익은 미리포기가 가능ㄴ하나, 제척기간에는 포기가 인정되지 않는다.", answer: "X", reason: "소멸시효의 이익은 미리 포기할 수 없으나(제184조 제1항), 제척기간은 완성 전은 물론 완성 후에도 포기라는 개념 자체가 인정되지 않는다." },
            { id: 158, article: "시효완성의 이익을 받을 당사자가 또는 그 대리인은 시효이익 포기의 의사표시를 할 수 있다.", answer: "O", reason: "시효완성 후 시효이익을 받을 당사자 또는 그 대리인은 시효이익 포기의 의사표시를 할 수 있다." },
            { id: 159, article: "채권의 시효이익을 포기한 경우, 이는 채권자와 채무자의 관계에서만 효력이 생긴다", answer: "O", reason: "시효이익의 포기는 상대적 효력만 있으므로 시효이익을 포기한 당사자와 그 상대방 사이에서만 효력이 발생한다." },
            { id: 160, article: "주채무자가 시효이익을 포기하더라도 보증인에게는 그 효력이 없다.", answer: "O", reason: "주채무자가 시효이익을 포기하더라도 보증인에게는 그 효력이 미치지 않으므로, 보증인은 여전히 주채무의 소멸시효 완성을 주장할 수 있다(상대적 효력)." },
            { id: 161, article: "시효이익을 포기하면 그때부터 시효가 새로진행한다.", answer: "O", reason: "시효이익은 완성 전 포기할 수 있지만 완성 후에는 포기 할 수 없다." },
            { id: 162, article: "시효이익의 포기는 철회하지 못한다", answer: "O", reason: "시효이익은 완성 전 포기할 수 있지만 완성 후에는 포기 할 수 없다." },
            { id: 163, article: "소멸시효는 법률행위에 의하여 이를 배제하거나 연장할 수 없다.", answer: "O", reason: "소멸시효는 법률행위에 의하여 이를 배제, 연장 또는 중화할 수 없으나 단축 또는 경감할 수 있다(민법 제184조 제2항)." },
            { id: 164, article: "분필절차를 거치지 않는 1필의 토지의 일부에 대해서도 저당권을 설정할 수 있다", answer: "X", reason: "민법상 일물일권주의 '일부'만 추가가능= 용익물권(지상권 지역권 전세권)" },
            { id: 165, article: "1필의 토지의 일부는 분필절차를 거치지 않는 한 용익물권의 객체가 될 수 없다", answer: "X", reason: "민법상 일물일권주의 '일부'만 추가가능= 용익물권(지상권 지역권 전세권)" },
            { id: 166, article: "법률상 공시방법으로 인정되지 않는 유동집합물이라도 특정성이 있으면 이를 양도담보의 목적으로 할 수 있다.", answer: "O", reason: "유동집합물이라도 특징성 있으면=뱀장어 양식장" }
        ];

        let rawDeck = loadStoredDeck();
        let currentDeck = [...rawDeck];
        let currentIndex = 0;
        let isFlipped = false;
        let currentFilter = 'ALL';
        const userAnswers = loadStoredAnswers();

        const flashcard = document.getElementById('flashcard');
        const cardContainer = document.getElementById('cardContainer');
        const articleText = document.getElementById('articleText');
        const reasonText = document.getElementById('reasonText');
        const correctAnswerDisplay = document.getElementById('correctAnswerDisplay');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');
        const resultBadge = document.getElementById('resultBadge');
        const cardBadge = document.getElementById('cardBadge');
        const btnAnswerO = document.getElementById('btnAnswerO');
        const btnAnswerX = document.getElementById('btnAnswerX');
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');

        function loadStoredDeck() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_DECK);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch(e) {
                console.error("저장된 문제 덱 로드 실패:", e);
            }
            return [...defaultDeck];
        }

        function loadStoredAnswers() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_ANSWERS);
                if (saved) return JSON.parse(saved);
            } catch(e) {
                console.error("저장된 답안 히스토리 로드 실패:", e);
            }
            return {};
        }

        function saveDeckToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_DECK, JSON.stringify(rawDeck));
            } catch(e) {
                console.error("문제 덱 저장 실패:", e);
            }
        }

        function saveAnswersToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
            } catch(e) {
                console.error("답안 히스토리 저장 실패:", e);
            }
        }

        function resetToDefaultDeck() {
            if (confirm("기본 166개 문제 덱으로 초기화하고 풀이 기록을 지우시겠습니까?")) {
                localStorage.removeItem(STORAGE_KEY_DECK);
                localStorage.removeItem(STORAGE_KEY_ANSWERS);
                rawDeck = [...defaultDeck];
                for (let key in userAnswers) delete userAnswers[key];
                saveDeckToStorage();
                saveAnswersToStorage();
                setFilter('ALL');
            }
        }

        // 🎲 Fisher-Yates 카드 셔플 함수
        function shuffleDeck() {
            if (currentDeck.length <= 1) {
                alert("섞을 카드가 2개 이상이어야 합니다.");
                return;
            }

            for (let i = currentDeck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
            }

            currentIndex = 0;
            renderCard();
        }

        function getCardKey(card) {
            return card.id || `card-${card.article}`;
        }

        cardContainer.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;

            isFlipped = !isFlipped;
            if (isFlipped) {
                flashcard.classList.add('rotate-y-180');
            } else {
                flashcard.classList.remove('rotate-y-180');
            }
        });

        function renderCard() {
            updateFilterCounts();

            if (currentDeck.length === 0) {
                articleText.textContent = "해당하는 카드가 없습니다.";
                reasonText.textContent = "";
                correctAnswerDisplay.textContent = "";
                progressText.textContent = "0 / 0";
                progressBar.style.width = '0%';
                cardBadge.textContent = "";
                resultBadge.className = "hidden";
                btnAnswerO.disabled = true;
                btnAnswerX.disabled = true;
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            btnAnswerO.disabled = false;
            btnAnswerX.disabled = false;

            if (isFlipped) {
                unflipCardSilently();
            }

            const currentCard = currentDeck[currentIndex];
            articleText.textContent = currentCard.article || "지문 내용이 없습니다.";
            reasonText.textContent = currentCard.reason || "상세 해설이 없습니다.";
            
            const rawAns = (currentCard.answer || "O").trim().toUpperCase();
            correctAnswerDisplay.textContent = rawAns === 'O' ? "O (옳은 지문)" : "X (틀린 지문)";
            
            if (rawAns === 'O') {
                correctAnswerDisplay.className = "text-2xl font-black text-emerald-400";
            } else {
                correctAnswerDisplay.className = "text-2xl font-black text-rose-400";
            }

            const key = getCardKey(currentCard);
            const pastAnswer = userAnswers[key];
            if (pastAnswer) {
                showResultBadge(pastAnswer.isCorrect, pastAnswer.userAns);
            } else {
                resultBadge.className = "hidden";
            }

            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === currentDeck.length - 1;

            const total = currentDeck.length;
            const currentNum = currentIndex + 1;
            progressText.textContent = `${currentNum} / ${total}`;
            progressBar.style.width = `${(currentNum / total) * 100}%`;
            cardBadge.textContent = `No. ${currentCard.id || currentNum}`;
        }

        function unflipCardSilently() {
            isFlipped = false;
            correctAnswerDisplay.textContent = "";
            reasonText.textContent = "";

            flashcard.style.transition = 'none';
            flashcard.classList.remove('rotate-y-180');
            
            void flashcard.offsetHeight;
            flashcard.style.transition = '';
        }

        function showResultBadge(isCorrect, userAns) {
            resultBadge.classList.remove('hidden');
            if (isCorrect) {
                resultBadge.textContent = `정답! (내가 택한 답: ${userAns})`;
                resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 border border-emerald-200";
            } else {
                resultBadge.textContent = `오답 (내가 택한 답: ${userAns})`;
                resultBadge.className = "text-xs font-bold px-3 py-1 rounded-full bg-rose-100 text-rose-700 border border-rose-200";
            }
        }

        function submitAnswer(userAns) {
            if (currentDeck.length === 0) return;
            const currentCard = currentDeck[currentIndex];
            const rawAns = (currentCard.answer || "O").trim().toUpperCase();
            const isCorrect = userAns === rawAns;

            const key = getCardKey(currentCard);
            userAnswers[key] = { isCorrect, userAns };
            saveAnswersToStorage();

            showResultBadge(isCorrect, userAns);

            if (!isFlipped) {
                isFlipped = true;
                flashcard.classList.add('rotate-y-180');
            }

            updateFilterCounts();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                renderCard();
            }
        }

        function nextCard() {
            if (currentIndex < currentDeck.length - 1) {
                currentIndex++;
                renderCard();
            }
        }

        function resetCurrentCardState() {
            if (currentDeck.length === 0) return;
            const currentCard = currentDeck[currentIndex];
            const key = getCardKey(currentCard);
            delete userAnswers[key];
            saveAnswersToStorage();
            renderCard();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            
            const btnAll = document.getElementById('filterAll');
            const btnInc = document.getElementById('filterIncorrect');
            const btnUnans = document.getElementById('filterUnanswered');

            const activeClass = "px-3 py-1 rounded-lg bg-indigo-50 text-indigo-600 font-bold border border-indigo-200 transition-all";
            const inactiveClass = "px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 border border-slate-200 transition-all";

            btnAll.className = filterType === 'ALL' ? activeClass : inactiveClass;
            btnInc.className = filterType === 'INCORRECT' ? activeClass : inactiveClass;
            btnUnans.className = filterType === 'UNANSWERED' ? activeClass : inactiveClass;

            applyFilter();
        }

        function applyFilter() {
            if (currentFilter === 'ALL') {
                currentDeck = [...rawDeck];
            } else if (currentFilter === 'INCORRECT') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return ans && !ans.isCorrect;
                });
            } else if (currentFilter === 'UNANSWERED') {
                currentDeck = rawDeck.filter(card => {
                    const ans = userAnswers[getCardKey(card)];
                    return !ans;
                });
            }

            currentIndex = 0;
            renderCard();
        }

        function updateFilterCounts() {
            document.getElementById('countAll').textContent = rawDeck.length;

            let incCount = 0;
            let unansCount = 0;

            rawDeck.forEach(card => {
                const ans = userAnswers[getCardKey(card)];
                if (!ans) unansCount++;
                else if (!ans.isCorrect) incCount++;
            });

            document.getElementById('countIncorrect').textContent = incCount;
            document.getElementById('countUnanswered').textContent = unansCount;
        }

        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const buffer = e.target.result;
                let text = "";

                try {
                    const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
                    text = utf8Decoder.decode(buffer);
                } catch (err) {
                    try {
                        const eucKrDecoder = new TextDecoder('euc-kr');
                        text = eucKrDecoder.decode(buffer);
                    } catch (eucErr) {
                        const ansiDecoder = new TextDecoder('iso-8859-1');
                        text = ansiDecoder.decode(buffer);
                    }
                }

                parseCSVData(text);
            };
            
            reader.readAsArrayBuffer(file);
        }

        function parseCSVData(text) {
            const lines = text.split(/\r\n|\n/);
            const parsed = [];
            let isHeader = true;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const tokens = parseCSVLine(line);
                if (tokens.length < 2) continue;

                if (isHeader && (tokens[0].includes("지문") || tokens[0].includes("question") || tokens[0].toLowerCase().includes("article"))) {
                    isHeader = false;
                    continue;
                }
                isHeader = false;

                const article = tokens[0] ? tokens[0].trim() : "";
                const answer = tokens[1] ? tokens[1].trim().toUpperCase() : "O";
                const reason = tokens[2] ? tokens[2].trim() : "해설이 제공되지 않았습니다.";

                if (article) {
                    parsed.push({
                        id: parsed.length + 1,
                        article,
                        answer,
                        reason
                    });
                }
            }

            if (parsed.length > 0) {
                rawDeck = parsed;
                for (let key in userAnswers) delete userAnswers[key];
                
                saveDeckToStorage();
                saveAnswersToStorage();

                setFilter('ALL');
                alert(`성공적으로 ${parsed.length}개의 OX 문제를 불러왔으며 브라우저에 자동 저장되었습니다!`);
            } else {
                alert("CSV 파일에서 유효한 문제 데이터를 찾지 못했습니다. 템플릿 양식을 확인해 주세요.");
            }
        }

        function parseCSVLine(text) {
            const delimiter = text.includes('\t') ? '\t' : ',';
            const result = [];
            let cur = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    inQuotes = !inQuotes;
                } else if (c === delimiter && !inQuotes) {
                    result.push(cur);
                    cur = '';
                } else {
                    cur += c;
                }
            }
            result.push(cur);
            return result.map(str => str.replace(/^"|"$/g, '').replace(/""/g, '"'));
        }

        function downloadCSVTemplate() {
            const csvContent = "\uFEFF지문,정답,해설\n" +
                "\"독립한 부동산은 종물이 될 수 없다.\",X,\"독립된 건물이라도 주물의 효용을 돕는다면 종물이 될 수 있습니다.\"\n" +
                "\"부첩관계의 종료를 해제조건으로 하는 증여계약은 무효이다.\",O,\"불륜관계 유지를 강요하는 불법조건이므로 무효입니다.\"\n" +
                "\"이중매매임을 알고 매수한 것만으로 무효가 되지는 않는다.\",O,\"단순 악의만으로는 유효하며, 적극 가담해야 무효가 됩니다.\"";

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "민법_OX_플래시카드_템플릿.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        renderCard();
    </script>
